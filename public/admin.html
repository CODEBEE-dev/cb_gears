<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="codebridgeai_favicon.png">

  <script src="js/common/config.js"></script>

  <!-- Google Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>

  <title>Account Management</title>
</head>

<body>
  <header id="appHeader"></header>

  <main>
    <nav class="activity-bar expanded" id="activityBar"></nav>
    <div class="container">
    <div class="admin-container">

      <!-- 탭 (school_admin만 그룹 탭 표시) -->
      <div class="tab-bar" id="adminTabBar" style="display:none;">
        <button class="tab-btn active" id="tabAccounts">
          <span class="material-symbols-rounded">people</span>
          <span id="tabLabelAccounts"></span>
        </button>
        <button class="tab-btn" id="tabGroups">
          <span class="material-symbols-rounded">account_tree</span>
          <span id="tabLabelGroups"></span>
        </button>
      </div>

      <!-- 계정 뷰 -->
      <div id="viewAccounts">
        <!-- 본인 정보 카드 -->
        <div class="my-info-card" id="myInfoCard" style="display:none;">
          <span class="material-symbols-rounded my-info-icon">account_circle</span>
          <div class="my-info-body">
            <div class="my-info-name" id="myInfoName"></div>
            <div class="my-info-meta">
              <span class="role-badge" id="myInfoRole"></span>
              <div class="my-info-groups" id="myInfoGroups"></div>
            </div>
          </div>
        </div>
        <div class="admin-toolbar">
          <div class="search-bar">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="searchInput" placeholder="">
          </div>
          <button class="btn-new" id="btnAddUser">
            <span class="material-symbols-rounded">person_add</span>
            <span id="labelAddUser"></span>
          </button>
        </div>
        <div class="admin-table-wrapper">
          <table class="admin-table" id="userTable">
            <thead>
              <tr>
                <th id="thUsername"></th>
                <th id="thEmail"></th>
                <th id="thName"></th>
                <th id="thRole"></th>
                <th id="thGroup"></th>
                <th id="thStatus"></th>
                <th id="thActions"></th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="7" class="table-loading" id="tableLoading"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 그룹 뷰 (school_admin만) -->
      <div id="viewGroups" style="display:none;">
        <div class="admin-toolbar" style="justify-content:space-between;">
          <div></div>
          <button class="btn-new" id="btnAddGroup">
            <span class="material-symbols-rounded">add</span>
            <span id="labelAddGroup"></span>
          </button>
        </div>
        <div id="groupTree"></div>
      </div>

    </div>
    </div>
  </main>

  <!-- 사용자 추가/수정 모달 -->
  <div class="modal-overlay" id="userModalOverlay">
    <div class="modal modal-wide">
      <h2 id="userModalTitle"></h2>
      <div class="form-grid">
        <label>
          <span id="labelUsername"></span>
          <input type="text" id="inputUsername" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelEmail"></span>
          <input type="email" id="inputEmail" maxlength="200" autocomplete="off">
        </label>
        <label>
          <span id="labelLastname"></span>
          <input type="text" id="inputLastname" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelFirstname"></span>
          <input type="text" id="inputFirstname" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelPassword"></span>
          <input type="password" id="inputPassword" maxlength="200" autocomplete="new-password">
        </label>
        <label>
          <span id="labelRole"></span>
          <select id="inputRole">
            <option value="student"></option>
            <option value="teacher"></option>
          </select>
        </label>
        <!-- school_admin: cascade 그룹 선택 / teacher: 단일 select 그룹 선택 -->
        <div id="groupCascadeWrap" style="display:none; grid-column:1/-1;"></div>
        <label id="groupSelectWrap" style="display:none;">
          <span id="labelGroupSelect"></span>
          <select id="inputGroupSelect"></select>
        </label>
        <label class="label-checkbox">
          <input type="checkbox" id="inputEnabled" checked>
          <span id="labelEnabled"></span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnUserModalCancel"></button>
        <button class="btn-create" id="btnUserModalSave"></button>
      </div>
    </div>
  </div>

  <!-- 그룹 생성 모달 -->
  <div class="modal-overlay" id="groupModalOverlay">
    <div class="modal modal-wide">
      <h2 id="groupModalTitle"></h2>
      <div class="form-grid" style="grid-template-columns:1fr;">
        <label>
          <span id="labelGroupId"></span>
          <input type="text" id="inputGroupId" maxlength="100">
        </label>
        <label>
          <span id="labelGroupParent"></span>
          <select id="inputGroupParent">
            <option value=""></option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnGroupModalCancel"></button>
        <button class="btn-create" id="btnGroupModalSave"></button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal">
      <h2 id="deleteModalTitle"></h2>
      <p id="deleteModalDesc" style="margin:0; font-size:0.9rem; color:#666;"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDeleteCancel"></button>
        <button class="btn-delete-confirm" id="btnDeleteConfirm"></button>
      </div>
    </div>
  </div>

  <script>
    // ── i18n ──
    // appTitle은 initHeader에서 처리
    document.getElementById('labelAddUser').textContent = i18n.get('#admin-add_user#')
    document.getElementById('searchInput').placeholder = i18n.get('#admin-search_placeholder#')
    document.getElementById('thUsername').textContent = i18n.get('#admin-username#')
    document.getElementById('thEmail').textContent = i18n.get('#admin-email#')
    document.getElementById('thName').textContent = i18n.get('#admin-name#')
    document.getElementById('thRole').textContent = i18n.get('#admin-role#')
    document.getElementById('thGroup').textContent = i18n.get('#admin-group#')
    document.getElementById('thStatus').textContent = i18n.get('#admin-status#')
    document.getElementById('thActions').textContent = i18n.get('#admin-actions#')
    document.getElementById('tableLoading').textContent = i18n.get('#admin-loading#')
    document.getElementById('labelUsername').textContent = i18n.get('#admin-username#')
    document.getElementById('labelEmail').textContent = i18n.get('#admin-email#')
    document.getElementById('labelFirstname').textContent = i18n.get('#admin-firstname#')
    document.getElementById('labelLastname').textContent = i18n.get('#admin-lastname#')
    document.getElementById('labelPassword').textContent = i18n.get('#admin-password#')
    document.getElementById('labelRole').textContent = i18n.get('#admin-role#')
    document.getElementById('labelEnabled').textContent = i18n.get('#admin-enabled#')
    document.getElementById('labelGroupSelect').textContent = i18n.get('#admin-group#')
    document.getElementById('btnUserModalCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('tabLabelAccounts').textContent = i18n.get('#admin-accounts#')
    document.getElementById('tabLabelGroups').textContent = i18n.get('#admin-groups#')
    document.getElementById('labelAddGroup').textContent = i18n.get('#admin-add_group#')
    document.getElementById('groupModalTitle').textContent = i18n.get('#admin-add_group#')
    document.getElementById('labelGroupId').textContent = i18n.get('#admin-group_id#')
    document.getElementById('labelGroupParent').textContent = i18n.get('#admin-group_parent#')
    document.getElementById('inputGroupId').placeholder = i18n.get('#admin-group_id_placeholder#')
    document.getElementById('btnGroupModalCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('btnGroupModalSave').textContent = i18n.get('#admin-create#')
    document.getElementById('deleteModalTitle').textContent = i18n.get('#admin-delete_confirm#')
    document.getElementById('deleteModalDesc').textContent = i18n.get('#admin-delete_desc#')
    document.getElementById('btnDeleteCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('btnDeleteConfirm').textContent = i18n.get('#admin-delete#')

    // role select 옵션 텍스트
    document.querySelector('#inputRole option[value="student"]').textContent = i18n.get('#admin-role_student#')
    document.querySelector('#inputRole option[value="teacher"]').textContent = i18n.get('#admin-role_teacher#')

    // ── 상태 ──
    let currentUser = null
    let editingUserId = null
    let isSaving = false
    let searchTimer = null
    let groupTree = []  // school_admin용 그룹 트리 (root 바로 아래 children)

    // ── 그룹 목록 로드 ──
    let teacherGroups = []  // teacher용 그룹 목록 (flat)

    async function loadGroups() {
      const res = await fetch('/api/admin/groups')
      if (!res.ok) return
      const data = await res.json()
      if (currentUser?.role === 'teacher') {
        teacherGroups = data.groups || []
      } else {
        groupTree = data.groups || []
      }
    }

    function groupName(groups) {
      if (!groups || groups.length === 0) return '-'
      return groups.map(g => {
        if (!g.path) return g.name
        // root(첫 번째 segment) 제외: /root/grade/class → grade/class
        return g.path.replace(/^\/[^/]+\//, '').replace(/\//g, ' / ') || g.name
      }).join(', ')
    }

    // ── 역할 표시 ──
    function roleLabel(role) {
      const map = {
        student: i18n.get('#admin-role_student#'),
        teacher: i18n.get('#admin-role_teacher#'),
        school_admin: i18n.get('#admin-role_school_admin#'),
      }
      return map[role] || (role || '-')
    }

    // ── 테이블 렌더링 ──
    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody')
      tbody.innerHTML = ''
      if (!users.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty">${i18n.get('#admin-no_users#')}</td></tr>`
        return
      }
      users.forEach(u => {
        const role = (u.realmRoles || []).find(r => ['school_admin','teacher','student'].includes(r)) || ''
        const grp = groupName(u.groups)
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td>${escHtml(u.username || '')}</td>
          <td>${escHtml(u.email || '')}</td>
          <td>${escHtml([u.lastName, u.firstName].filter(Boolean).join(' ') || '')}</td>
          <td><span class="role-badge role-${role}">${escHtml(roleLabel(role))}</span></td>
          <td>${escHtml(grp)}</td>
          <td><span class="status-badge ${u.enabled ? 'status-active' : 'status-inactive'}">${u.enabled ? i18n.get('#admin-active#') : i18n.get('#admin-inactive#')}</span></td>
          <td class="actions-cell">
            <button class="btn-icon" data-action="edit" data-id="${u.id}" title="${i18n.get('#admin-edit#')}">
              <span class="material-symbols-rounded">edit</span>
            </button>
            <button class="btn-icon btn-icon-danger" data-action="delete" data-id="${u.id}" data-name="${escHtml(u.username)}" title="${i18n.get('#admin-delete#')}">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </td>
        `
        tbody.appendChild(tr)
      })

      tbody.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id))
      })
      tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => confirmDelete(btn.dataset.id, btn.dataset.name))
      })
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    // ── 데이터 로드 ──
    async function loadUsers(search = '') {
      const tbody = document.getElementById('userTableBody')
      tbody.innerHTML = `<tr><td colspan="6" class="table-loading">${i18n.get('#admin-loading#')}</td></tr>`
      const params = new URLSearchParams({ max: 100 })
      if (search) params.set('search', search)
      const res = await fetch(`/api/admin/users?${params}`)
      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty">${i18n.get('#admin-load_error#')}</td></tr>`
        return
      }
      const data = await res.json()

      renderUsers(data.users)
    }

    // ── 검색 ──
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => loadUsers(document.getElementById('searchInput').value.trim()), 350)
    })

    // ── 모달 열기/닫기 ──
    function applyRoleOptions() {
      const isTeacher = currentUser?.role === 'teacher'
      const roleSelect = document.getElementById('inputRole')
      // teacher는 student만 생성 가능
      Array.from(roleSelect.options).forEach(opt => {
        opt.hidden = isTeacher && opt.value !== 'student'
      })
      if (isTeacher) roleSelect.value = 'student'
    }

    // ── cascade 그룹 선택 ──
    // nodes: 현재 depth의 그룹 배열, depth: 0부터 시작
    // selectedIds: 복원용 [depth0Id, depth1Id, ...]
    function buildCascadeSelects(nodes, depth, selectedIds = []) {
      const wrap = document.getElementById('groupCascadeWrap')

      // 기존 depth 이후의 select 제거
      while (wrap.children.length > depth) {
        wrap.removeChild(wrap.lastChild)
      }

      if (!nodes || nodes.length === 0) return

      const label = document.createElement('label')
      const span = document.createElement('span')
      span.textContent = i18n.get('#admin-group#') || '그룹'
      const select = document.createElement('select')
      select.dataset.depth = depth

      const emptyOpt = document.createElement('option')
      emptyOpt.value = ''
      emptyOpt.textContent = i18n.get('#admin-no_group#') || '-- 선택 --'
      select.appendChild(emptyOpt)

      nodes.forEach(g => {
        const opt = document.createElement('option')
        opt.value = g.id
        opt.textContent = g.name
        opt.dataset.childCount = g.children?.length || 0
        select.appendChild(opt)
      })

      // 복원: selectedIds[depth]가 있으면 해당 값 선택
      if (selectedIds[depth]) {
        select.value = selectedIds[depth]
      }

      select.addEventListener('change', () => {
        const selectedNode = nodes.find(g => g.id === select.value)
        const role = document.getElementById('inputRole').value
        if (selectedNode?.children?.length) {
          buildCascadeSelects(selectedNode.children, depth + 1)
        } else {
          // 하위 그룹 없거나 teacher이면 이후 select 제거
          while (wrap.children.length > depth + 1) {
            wrap.removeChild(wrap.lastChild)
          }
        }
      })

      label.appendChild(span)
      label.appendChild(select)
      wrap.appendChild(label)

      // 복원: 선택된 값이 있고 children이 있으면 다음 depth도 렌더링
      if (selectedIds[depth]) {
        const selectedNode = nodes.find(g => g.id === selectedIds[depth])
        if (selectedNode?.children?.length) {
          buildCascadeSelects(selectedNode.children, depth + 1, selectedIds)
        }
      }
    }

    function applyGroupField(selectedGroupId = '') {
      const isSchoolAdmin = currentUser?.role === 'school_admin'
      const isTeacher = currentUser?.role === 'teacher'
      const cascadeWrap = document.getElementById('groupCascadeWrap')
      const selectWrap = document.getElementById('groupSelectWrap')

      // school_admin: cascade 선택기
      if (isSchoolAdmin) {
        cascadeWrap.style.display = ''
        selectWrap.style.display = 'none'
        if (!selectedGroupId) {
          buildCascadeSelects(groupTree, 0)
        } else {
          restoreCascadeSelection(selectedGroupId)
        }
        return
      }

      // teacher: 단일 select (그룹이 2개 이상인 경우만 표시)
      if (isTeacher && teacherGroups.length > 1) {
        cascadeWrap.style.display = 'none'
        selectWrap.style.display = ''
        const select = document.getElementById('inputGroupSelect')
        select.innerHTML = ''
        const emptyOpt = document.createElement('option')
        emptyOpt.value = ''
        emptyOpt.textContent = i18n.get('#admin-select_group#')
        select.appendChild(emptyOpt)
        teacherGroups.forEach(g => {
          const opt = document.createElement('option')
          opt.value = g.id
          // path에서 root segment 제거해서 표시
          opt.textContent = g.path ? g.path.replace(/^\/[^/]+\//, '').replace(/\//g, ' / ') : g.name
          select.appendChild(opt)
        })
        if (selectedGroupId) select.value = selectedGroupId
        return
      }

      // teacher 단일 그룹이거나 그룹 없음: 선택기 숨김
      cascadeWrap.style.display = 'none'
      cascadeWrap.innerHTML = ''
      selectWrap.style.display = 'none'
    }

    // 수정 모달 복원: groupId로 경로상의 id 배열을 찾아 cascade 렌더링
    function restoreCascadeSelection(targetGroupId) {
      const path = findGroupPath(groupTree, targetGroupId)
      buildCascadeSelects(groupTree, 0, path)
    }

    // groupTree에서 targetId까지의 id 경로 배열 반환 (못 찾으면 null)
    function findGroupPath(nodes, targetId, path = []) {
      for (const node of nodes) {
        const current = [...path, node.id]
        if (node.id === targetId) return current
        if (node.children?.length) {
          const found = findGroupPath(node.children, targetId, current)
          if (found) return found
        }
      }
      return null
    }

    // cascade에서 선택된 최하위 groupId 반환
    function getSelectedGroupId() {
      const wrap = document.getElementById('groupCascadeWrap')
      const selects = Array.from(wrap.querySelectorAll('select'))
      if (selects.length === 0) return null

      const role = document.getElementById('inputRole').value

      // teacher/student 모두 최하위까지 cascade, 마지막 select 값 사용
      const lastSelect = selects[selects.length - 1]
      if (!lastSelect?.value) return null
      const selectedOpt = lastSelect.options[lastSelect.selectedIndex]
      if (parseInt(selectedOpt.dataset.childCount) > 0) {
        return null  // 아직 최하위까지 선택 안 됨
      }
      return lastSelect.value
    }

    function openAddModal() {
      editingUserId = null
      document.getElementById('userModalTitle').textContent = i18n.get('#admin-modal_add_title#')
      document.getElementById('btnUserModalSave').textContent = i18n.get('#admin-create#')
      document.getElementById('inputUsername').value = ''
      document.getElementById('inputEmail').value = ''
      document.getElementById('inputFirstname').value = ''
      document.getElementById('inputLastname').value = ''
      document.getElementById('inputPassword').value = ''
      document.getElementById('inputPassword').placeholder = ''
      document.getElementById('inputEnabled').checked = true
      document.getElementById('inputUsername').disabled = false
      applyRoleOptions()
      applyGroupField()
      document.getElementById('userModalOverlay').classList.add('open')
      document.getElementById('inputUsername').focus()
    }

    async function openEditModal(userId) {
      editingUserId = userId
      document.getElementById('userModalTitle').textContent = i18n.get('#admin-modal_edit_title#')
      document.getElementById('btnUserModalSave').textContent = i18n.get('#admin-save#')
      document.getElementById('inputPassword').placeholder = i18n.get('#admin-password_placeholder#')

      const res = await fetch(`/api/admin/users/${userId}`)
      if (!res.ok) return
      const { user } = await res.json()

      document.getElementById('inputUsername').value = user.username || ''
      document.getElementById('inputUsername').disabled = true
      document.getElementById('inputEmail').value = user.email || ''
      document.getElementById('inputFirstname').value = user.firstName || ''
      document.getElementById('inputLastname').value = user.lastName || ''
      document.getElementById('inputPassword').value = ''
      const role = (user.realmRoles || []).find(r => ['school_admin','teacher','student'].includes(r)) || 'student'
      const roleSelect = document.getElementById('inputRole')
      // school_admin 계정 편집: select에 없는 값이므로 option 임시 추가 후 disabled
      let tempAdminOpt = null
      if (role === 'school_admin') {
        tempAdminOpt = document.createElement('option')
        tempAdminOpt.value = 'school_admin'
        tempAdminOpt.textContent = i18n.get('#admin-role_school_admin#') || '학교 관리자'
        roleSelect.appendChild(tempAdminOpt)
        roleSelect.disabled = true
      } else {
        roleSelect.disabled = false
      }
      roleSelect.value = role
      document.getElementById('inputEnabled').checked = !!user.enabled
      applyRoleOptions()
      const currentGroupId = user.groups?.[0]?.id || ''
      applyGroupField(currentGroupId)
      document.getElementById('userModalOverlay').classList.add('open')
    }

    function closeUserModal() {
      document.getElementById('userModalOverlay').classList.remove('open')
      document.getElementById('inputUsername').disabled = false
      // 임시로 추가한 school_admin option 제거 및 disabled 해제
      const roleSelect = document.getElementById('inputRole')
      roleSelect.disabled = false
      const tmpOpt = roleSelect.querySelector('option[value="school_admin"]')
      if (tmpOpt) roleSelect.removeChild(tmpOpt)
    }

    // 역할 변경 시 그룹 선택 초기화
    document.getElementById('inputRole').addEventListener('change', () => {
      applyGroupField()
    })

    document.getElementById('btnAddUser').addEventListener('click', openAddModal)
    document.getElementById('btnUserModalCancel').addEventListener('click', closeUserModal)

    // ── 저장 ──
    document.getElementById('btnUserModalSave').addEventListener('click', saveUser)

    async function saveUser() {
      if (isSaving) return
      const username = document.getElementById('inputUsername').value.trim()
      const password = document.getElementById('inputPassword').value
      const role = document.getElementById('inputRole').value

      if (!editingUserId && (!username || !password)) {
        document.getElementById(username ? 'inputPassword' : 'inputUsername').focus()
        return
      }

      isSaving = true
      const isSchoolAdmin = currentUser?.role === 'school_admin'
      const body = {
        username,
        email: document.getElementById('inputEmail').value.trim(),
        firstName: document.getElementById('inputFirstname').value.trim(),
        lastName: document.getElementById('inputLastname').value.trim(),
        role,
        enabled: document.getElementById('inputEnabled').checked,
      }
      if (password) body.password = password
      // school_admin: cascade에서 선택한 그룹 ID 전송
      // teacher: 그룹이 2개 이상이면 select에서 선택한 값 전송 (단일이면 서버에서 자동 할당)
      if (isSchoolAdmin) {
        body.groupId = getSelectedGroupId()
      } else if (currentUser?.role === 'teacher' && teacherGroups.length > 1) {
        const selectedGroupId = document.getElementById('inputGroupSelect').value
        if (!selectedGroupId) {
          document.getElementById('inputGroupSelect').focus()
          isSaving = false
          return
        }
        body.groupId = selectedGroupId
      }

      const url = editingUserId ? `/api/admin/users/${editingUserId}` : '/api/admin/users'
      const method = editingUserId ? 'PUT' : 'POST'

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      isSaving = false

      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        alert(data.error || '저장에 실패했습니다.')
        return
      }

      closeUserModal()
      loadUsers(document.getElementById('searchInput').value.trim())
    }

    // ── 삭제 ──
    function confirmDelete(userId, username) {
      const overlay = document.getElementById('deleteModalOverlay')
      overlay.classList.add('open')

      function onConfirm() {
        fetch(`/api/admin/users/${userId}`, { method: 'DELETE' })
          .then(res => {
            if (!res.ok) return res.json().then(d => { throw new Error(d.error) })
          })
          .then(() => loadUsers(document.getElementById('searchInput').value.trim()))
          .catch(err => alert(err.message || '삭제에 실패했습니다.'))
        cleanup()
      }
      function cleanup() {
        overlay.classList.remove('open')
        document.getElementById('btnDeleteConfirm').removeEventListener('click', onConfirm)
        document.getElementById('btnDeleteCancel').removeEventListener('click', cleanup)
        overlay.removeEventListener('click', onOverlayClick)
      }
      function onOverlayClick(e) {
        if (e.target === overlay) cleanup()
      }

      document.getElementById('btnDeleteConfirm').addEventListener('click', onConfirm)
      document.getElementById('btnDeleteCancel').addEventListener('click', cleanup)
      overlay.addEventListener('click', onOverlayClick)
    }

    // ── 탭 전환 ──
    function switchAdminTab(tab) {
      const isAccounts = tab === 'accounts'
      document.getElementById('viewAccounts').style.display = isAccounts ? '' : 'none'
      document.getElementById('viewGroups').style.display   = isAccounts ? 'none' : ''
      document.getElementById('tabAccounts').classList.toggle('active', isAccounts)
      document.getElementById('tabGroups').classList.toggle('active', !isAccounts)
      if (!isAccounts) loadGroupTree()
    }

    document.getElementById('tabAccounts').addEventListener('click', () => switchAdminTab('accounts'))
    document.getElementById('tabGroups').addEventListener('click', () => switchAdminTab('groups'))

    // ── 그룹 트리 렌더링 ──
    let groupTreeData = []

    async function loadGroupTree() {
      const treeEl = document.getElementById('groupTree')
      treeEl.innerHTML = `<div class="empty-msg">${i18n.get('#admin-loading#')}</div>`
      const res = await fetch('/api/admin/groups')
      if (!res.ok) { treeEl.innerHTML = `<div class="empty-msg">${i18n.get('#admin-load_error#')}</div>`; return }
      const data = await res.json()
      groupTreeData = data.groups || []
      // 그룹 추가 모달의 상위 그룹 select도 업데이트 (flat)
      const flatRes = await fetch('/api/admin/groups?flat=true')
      if (flatRes.ok) {
        const flatData = await flatRes.json()
        const parentSelect = document.getElementById('inputGroupParent')
        parentSelect.innerHTML = `<option value="">${i18n.get('#admin-group_parent_root#')}</option>`
        flatData.groups.forEach(g => {
          const depth = (g.path.match(/\//g) || []).length - 1
          const opt = document.createElement('option')
          opt.value = g.id
          opt.textContent = '\u00a0\u00a0'.repeat(depth) + g.name
          parentSelect.appendChild(opt)
        })
      }
      if (groupTreeData.length === 0) {
        treeEl.innerHTML = `<div class="empty-msg">${i18n.get('#admin-no_groups#')}</div>`
        return
      }
      treeEl.innerHTML = ''
      const tree = renderGroupTree(groupTreeData)
      tree.className = 'group-tree'
      treeEl.appendChild(tree)
    }

    function renderGroupTree(nodes) {
      const container = document.createElement('div')
      container.className = 'group-tree'
      nodes.forEach(g => {
        const node = document.createElement('div')
        node.className = 'group-node'

        const row = document.createElement('div')
        row.className = 'group-node-row'
        row.innerHTML = `
          <span class="material-symbols-rounded">folder</span>
          <span class="group-node-display">${escHtml(g.name)}</span>
          <button class="btn-icon btn-icon-danger" title="${i18n.get('#admin-delete#')}">
            <span class="material-symbols-rounded">delete</span>
          </button>
        `
        row.querySelector('.btn-icon').addEventListener('click', () => confirmDeleteGroup(g.id, g.name))
        node.appendChild(row)

        if (g.children?.length) {
          const childrenWrap = document.createElement('div')
          childrenWrap.className = 'group-children'
          const childTree = renderGroupTree(g.children)
          childrenWrap.appendChild(childTree)
          node.appendChild(childrenWrap)
        }

        container.appendChild(node)
      })
      return container
    }

    // ── 그룹 생성 모달 ──
    function openGroupModal() {
      document.getElementById('inputGroupId').value = ''
      document.getElementById('inputGroupParent').value = ''
      document.getElementById('groupModalOverlay').classList.add('open')
      document.getElementById('inputGroupDisplayName').focus()
    }

    function closeGroupModal() {
      document.getElementById('groupModalOverlay').classList.remove('open')
    }

    document.getElementById('btnAddGroup').addEventListener('click', openGroupModal)
    document.getElementById('btnGroupModalCancel').addEventListener('click', closeGroupModal)
    document.getElementById('groupModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('groupModalOverlay')) closeGroupModal()
    })

    document.getElementById('btnGroupModalSave').addEventListener('click', async () => {
      const name     = document.getElementById('inputGroupId').value.trim()
      const parentId = document.getElementById('inputGroupParent').value

      if (!name) {
        document.getElementById('inputGroupId').focus()
        return
      }

      const res = await fetch('/api/admin/groups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, parentId: parentId || null }),
      })
      if (res.ok) {
        closeGroupModal()
        loadGroupTree()
        // 계정 생성 드롭다운도 갱신
        await loadGroups()
      } else {
        const data = await res.json().catch(() => ({}))
        alert(data.error || '그룹 생성에 실패했습니다.')
      }
    })

    // ── 그룹 삭제 ──
    function confirmDeleteGroup(groupId, displayName) {
      const overlay = document.getElementById('deleteModalOverlay')
      overlay.classList.add('open')

      function onConfirm() {
        fetch(`/api/admin/groups/${groupId}`, { method: 'DELETE' })
          .then(async r => {
            if (!r.ok) {
              const d = await r.json().catch(() => ({}))
              alert(d.error || '삭제에 실패했습니다.')
            } else {
              loadGroupTree()
              await loadGroups()
            }
          })
        cleanup()
      }
      function cleanup() {
        overlay.classList.remove('open')
        document.getElementById('btnDeleteConfirm').removeEventListener('click', onConfirm)
        document.getElementById('btnDeleteCancel').removeEventListener('click', cleanup)
        overlay.removeEventListener('click', onOverlayClick)
      }
      function onOverlayClick(e) { if (e.target === overlay) cleanup() }

      document.getElementById('btnDeleteConfirm').addEventListener('click', onConfirm)
      document.getElementById('btnDeleteCancel').addEventListener('click', cleanup)
      overlay.addEventListener('click', onOverlayClick)
    }

    function renderMyInfo(user) {
      if (!user) return
      const card = document.getElementById('myInfoCard')
      document.getElementById('myInfoName').textContent = user.name || user.email || ''
      const roleBadge = document.getElementById('myInfoRole')
      roleBadge.textContent = roleLabel(user.role)
      roleBadge.className = `role-badge role-${user.role}`
      const groupsEl = document.getElementById('myInfoGroups')
      const groups = user.groups || (user.group ? [user.group] : [])
      if (groups.length) {
        groupsEl.innerHTML = groups.map(path => {
          const label = path.replace(/^\/[^/]+\//, '').replace(/\//g, ' / ') || path
          return `<span class="my-info-group-tag">${escHtml(label)}</span>`
        }).join('')
      } else {
        groupsEl.innerHTML = ''
      }
      card.style.display = ''
    }

    ;(async () => {
      const user = await initHeader(i18n.get('#admin-title#'))
      if (user) currentUser = user
      renderMyInfo(currentUser)
      if (currentUser?.role === 'school_admin') {
        document.getElementById('adminTabBar').style.display = ''
        await loadGroups()
      } else if (currentUser?.role === 'teacher') {
        await loadGroups()
      }
      loadUsers()
    })()
  </script>
</body>
</html>
