<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="codebridgeai_favicon.png">
  <title>Settings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">

  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>

  <style>
    .settings-content {
      flex: 1;
      overflow-y: auto;
    }
    .settings-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }
    .settings-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.5rem;
    }
    .settings-section-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 1.2rem;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1rem;
      border: 2px solid var(--color-border);
      border-radius: 0.75rem;
      background: var(--color-surface);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .lang-btn:hover {
      border-color: var(--color-primary);
      background: var(--color-bg);
    }
    .lang-btn.active {
      border-color: var(--color-primary);
      background: #eef0fb;
      color: var(--color-primary);
    }
    .lang-btn .lang-flag {
      font-size: 1.2rem;
    }
    @media (max-width: 768px) {
      .settings-inner { padding: 1.2rem 1rem 3rem; }
      :root { --activity-bar-expanded: 160px; }
    }
    @media (max-width: 480px) {
      header .appName { display: none; }
      .activity-bar, .activity-bar.expanded {
        width: var(--activity-bar-collapsed);
        min-width: var(--activity-bar-collapsed);
      }
      .activity-label { display: none; }
      .settings-inner { padding: 1rem 0.75rem 3rem; }
    }
  </style>
</head>
<body>

<header id="appHeader"></header>

<main>
  <nav class="activity-bar expanded" id="activityBar"></nav>
  <div class="settings-content">
    <div class="settings-inner">
      <div class="settings-section">
        <div class="settings-section-title" id="langSectionTitle">언어 / Language</div>
        <div class="lang-grid" id="langGrid"></div>
      </div>
    </div>
  </div>
</main>

<script>
  const LANGUAGES = [
    { code: 'ko', label: '한국어', flag: '🇰🇷' },
    { code: 'en', label: 'English', flag: '🇺🇸' },
  ];

  const currentLang = localStorage.getItem('LANG') || 'ko';

  const grid = document.getElementById('langGrid');
  LANGUAGES.forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (lang.code === currentLang ? ' active' : '');
    btn.innerHTML = `<span class="lang-flag">${lang.flag}</span>${lang.label}`;
    btn.addEventListener('click', () => {
      localStorage.setItem('LANG', lang.code);
      location.reload();
    });
    grid.appendChild(btn);
  });

  initHeader(i18n.get('#nav-settings#'));
</script>
</body>
</html>
