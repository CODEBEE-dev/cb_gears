<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="codebridgeai_favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .card-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.9rem;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }

    .card-item:hover {
      border-color: #c5cbdf;
      box-shadow: 0 4px 16px rgba(38, 52, 163, 0.1);
      transform: translateY(-2px);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--color-bg);
      display: block;
    }

    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #eef0fb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0aadd;
    }

    .card-thumb-placeholder .material-symbols-rounded {
      font-size: 3rem;
    }

    .card-body {
      padding: 0.75rem 0.9rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      padding: 0 0.9rem 0.6rem;
      flex-shrink: 0;
    }
  </style>

  <script src="js/common/config.js"></script>
  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>

  <title>My Robots</title>
</head>

<body>
  <header id="appHeader"></header>

  <main>
    <nav class="activity-bar expanded" id="activityBar"></nav>
    <div class="container">
      <div class="content">
        <div class="content-header">
          <h2 class="section-title" id="pageTitle"></h2>
        </div>
        <div class="search-bar">
          <span class="material-symbols-rounded">search</span>
          <input type="text" id="searchInput" placeholder="">
        </div>
        <div class="card-grid" id="robotGrid"></div>
      </div>
    </div>
  </main>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal">
      <h2 id="deleteModalTitle"></h2>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDeleteCancel"></button>
        <button class="btn-delete-confirm" id="btnDeleteConfirm"></button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('pageTitle').textContent = i18n.get('#nav-robots#')
    document.getElementById('searchInput').placeholder = i18n.get('#robots-search_placeholder#')
    document.getElementById('deleteModalTitle').textContent = i18n.get('#admin-delete_confirm#')
    document.getElementById('btnDeleteCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('btnDeleteConfirm').textContent = i18n.get('#robots-delete_confirm#')

    let allRobots = []
    let searchTimer = null

    function renderGrid(robots) {
      const grid = document.getElementById('robotGrid')
      grid.innerHTML = ''
      if (robots.length === 0) {
        grid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">${i18n.get('#robots-no_robots#')}</div>`
        return
      }
      robots.forEach(r => {
        const item = document.createElement('div')
        item.className = 'card-item'

        const thumbWrap = r.thumbnail
          ? `<img class="card-thumb" src="${r.thumbnail}" alt="${r.name}" loading="lazy">`
          : `<div class="card-thumb-placeholder"><span class="material-symbols-rounded">smart_toy</span></div>`

        item.innerHTML = `
          ${thumbWrap}
          <div class="card-body">
            <span class="card-name" title="${r.name}">${r.name}</span>
            <button class="btn-delete" title="${i18n.get('#robots-delete_confirm#')}">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </div>
          <div class="card-date">${new Date(r.updated_at).toLocaleDateString()}</div>
        `

        item.querySelector('.btn-delete').addEventListener('click', (e) => {
          e.stopPropagation()
          confirmDelete(r.id, r.name, item)
        })

        item.addEventListener('click', () => {
          window.location.href = `/configurator?robotId=${r.id}`
        })

        grid.appendChild(item)
      })
    }

    function applySearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase()
      renderGrid(q ? allRobots.filter(r => r.name.toLowerCase().includes(q)) : allRobots)
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(applySearch, 250)
    })

    function confirmDelete(robotId, name, item) {
      const overlay = document.getElementById('deleteModalOverlay')
      overlay.classList.add('open')

      function onConfirm() {
        fetch(`/api/robots/${robotId}`, { method: 'DELETE' })
          .then(res => res.json())
          .then(data => {
            if (data.ok) {
              allRobots = allRobots.filter(r => r.id !== robotId)
              item.remove()
              applySearch()
            }
          })
        cleanup()
      }
      function cleanup() {
        overlay.classList.remove('open')
        document.getElementById('btnDeleteConfirm').removeEventListener('click', onConfirm)
        document.getElementById('btnDeleteCancel').removeEventListener('click', cleanup)
        overlay.removeEventListener('click', onOverlayClick)
      }
      function onOverlayClick(e) { if (e.target === overlay) cleanup() }

      document.getElementById('btnDeleteConfirm').addEventListener('click', onConfirm)
      document.getElementById('btnDeleteCancel').addEventListener('click', cleanup)
      overlay.addEventListener('click', onOverlayClick)
    }

    async function loadRobots() {
      const grid = document.getElementById('robotGrid')
      grid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">${i18n.get('#admin-loading#')}</div>`
      try {
        const res = await fetch('/api/robots')
        if (!res.ok) throw new Error(res.status)
        const data = await res.json()
        allRobots = data.robots || []
        applySearch()
      } catch (e) {
        grid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">로봇 목록을 불러오는 데 실패했습니다.</div>`
      }
    }

    ;(async () => {
      await initHeader(i18n.get('#nav-robots#'))
      loadRobots()
    })()
  </script>
</body>
</html>
