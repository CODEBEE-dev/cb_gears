<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="codebridgeai_favicon.png">

  <script src="js/common/config.js"></script>

  <!-- Google Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>

  <title>Account Management</title>
</head>

<body>
  <header id="appHeader"></header>

  <main>
    <nav class="activity-bar expanded" id="activityBar"></nav>
    <div class="container">
    <div class="admin-container">
      <div class="admin-toolbar">
        <div class="search-bar">
          <span class="material-symbols-rounded">search</span>
          <input type="text" id="searchInput" placeholder="">
        </div>
        <button class="btn-new" id="btnAddUser">
          <span class="material-symbols-rounded">person_add</span>
          <span id="labelAddUser"></span>
        </button>
      </div>

      <div class="admin-table-wrapper">
        <table class="admin-table" id="userTable">
          <thead>
            <tr>
              <th id="thUsername"></th>
              <th id="thEmail"></th>
              <th id="thName"></th>
              <th id="thRole"></th>
              <th id="thGroup"></th>
              <th id="thStatus"></th>
              <th id="thActions"></th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="7" class="table-loading" id="tableLoading"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    </div>
  </main>

  <!-- 사용자 추가/수정 모달 -->
  <div class="modal-overlay" id="userModalOverlay">
    <div class="modal modal-wide">
      <h2 id="userModalTitle"></h2>
      <div class="form-grid">
        <label>
          <span id="labelUsername"></span>
          <input type="text" id="inputUsername" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelEmail"></span>
          <input type="email" id="inputEmail" maxlength="200" autocomplete="off">
        </label>
        <label>
          <span id="labelLastname"></span>
          <input type="text" id="inputLastname" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelFirstname"></span>
          <input type="text" id="inputFirstname" maxlength="100" autocomplete="off">
        </label>
        <label>
          <span id="labelPassword"></span>
          <input type="password" id="inputPassword" maxlength="200" autocomplete="new-password">
        </label>
        <label>
          <span id="labelRole"></span>
          <select id="inputRole">
            <option value="student"></option>
            <option value="teacher"></option>
            <option value="school_admin"></option>
          </select>
        </label>
        <!-- school_admin만 표시 -->
        <label id="groupFieldWrap">
          <span id="labelGroup"></span>
          <select id="inputGroup">
            <option value=""></option>
          </select>
        </label>
        <label class="label-checkbox">
          <input type="checkbox" id="inputEnabled" checked>
          <span id="labelEnabled"></span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnUserModalCancel"></button>
        <button class="btn-create" id="btnUserModalSave"></button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal">
      <h2 id="deleteModalTitle"></h2>
      <p id="deleteModalDesc" style="margin:0; font-size:0.9rem; color:#666;"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDeleteCancel"></button>
        <button class="btn-delete-confirm" id="btnDeleteConfirm"></button>
      </div>
    </div>
  </div>

  <script>
    // ── i18n ──
    // appTitle은 initHeader에서 처리
    document.getElementById('labelAddUser').textContent = i18n.get('#admin-add_user#')
    document.getElementById('searchInput').placeholder = i18n.get('#admin-search_placeholder#')
    document.getElementById('thUsername').textContent = i18n.get('#admin-username#')
    document.getElementById('thEmail').textContent = i18n.get('#admin-email#')
    document.getElementById('thName').textContent = i18n.get('#admin-name#')
    document.getElementById('thRole').textContent = i18n.get('#admin-role#')
    document.getElementById('thGroup').textContent = i18n.get('#admin-group#')
    document.getElementById('thStatus').textContent = i18n.get('#admin-status#')
    document.getElementById('thActions').textContent = i18n.get('#admin-actions#')
    document.getElementById('tableLoading').textContent = i18n.get('#admin-loading#')
    document.getElementById('labelUsername').textContent = i18n.get('#admin-username#')
    document.getElementById('labelEmail').textContent = i18n.get('#admin-email#')
    document.getElementById('labelFirstname').textContent = i18n.get('#admin-firstname#')
    document.getElementById('labelLastname').textContent = i18n.get('#admin-lastname#')
    document.getElementById('labelPassword').textContent = i18n.get('#admin-password#')
    document.getElementById('labelRole').textContent = i18n.get('#admin-role#')
    document.getElementById('labelEnabled').textContent = i18n.get('#admin-enabled#')
    document.getElementById('labelGroup').textContent = i18n.get('#admin-group#')
    document.getElementById('btnUserModalCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('deleteModalTitle').textContent = i18n.get('#admin-delete_confirm#')
    document.getElementById('deleteModalDesc').textContent = i18n.get('#admin-delete_desc#')
    document.getElementById('btnDeleteCancel').textContent = i18n.get('#admin-cancel#')
    document.getElementById('btnDeleteConfirm').textContent = i18n.get('#admin-delete#')

    // role select 옵션 텍스트
    document.querySelector('#inputRole option[value="student"]').textContent = i18n.get('#admin-role_student#')
    document.querySelector('#inputRole option[value="teacher"]').textContent = i18n.get('#admin-role_teacher#')
    document.querySelector('#inputRole option[value="school_admin"]').textContent = i18n.get('#admin-role_school_admin#')

    // ── 상태 ──
    let currentUser = null
    let editingUserId = null
    let isSaving = false
    let searchTimer = null
    let allGroups = []  // school_admin용 그룹 목록

    // ── 그룹 목록 로드 (school_admin 전용) ──
    async function loadGroups() {
      const res = await fetch('/api/admin/groups')
      if (!res.ok) return
      const data = await res.json()
      allGroups = data.groups || []
      const select = document.getElementById('inputGroup')
      select.innerHTML = `<option value="">${i18n.get('#admin-no_group#')}</option>`
      allGroups.forEach(g => {
        // path depth로 들여쓰기 표현 (root 제외한 depth)
        const depth = (g.path.match(/\//g) || []).length - 1
        const opt = document.createElement('option')
        opt.value = g.id
        opt.textContent = '\u00a0\u00a0'.repeat(depth) + g.name
        select.appendChild(opt)
      })
    }

    function groupName(groups) {
      if (!groups || groups.length === 0) return '-'
      return groups.map(g => g.name).join(', ')
    }

    // ── 역할 표시 ──
    function roleLabel(role) {
      const map = {
        student: i18n.get('#admin-role_student#'),
        teacher: i18n.get('#admin-role_teacher#'),
        school_admin: i18n.get('#admin-role_school_admin#'),
      }
      return map[role] || (role || '-')
    }

    // ── 테이블 렌더링 ──
    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody')
      tbody.innerHTML = ''
      if (!users.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty">${i18n.get('#admin-no_users#')}</td></tr>`
        return
      }
      users.forEach(u => {
        const role = (u.realmRoles || []).find(r => ['school_admin','teacher','student'].includes(r)) || ''
        const grp = groupName(u.groups)
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td>${escHtml(u.username || '')}</td>
          <td>${escHtml(u.email || '')}</td>
          <td>${escHtml([u.lastName, u.firstName].filter(Boolean).join(' ') || '')}</td>
          <td><span class="role-badge role-${role}">${escHtml(roleLabel(role))}</span></td>
          <td>${escHtml(grp)}</td>
          <td><span class="status-badge ${u.enabled ? 'status-active' : 'status-inactive'}">${u.enabled ? i18n.get('#admin-active#') : i18n.get('#admin-inactive#')}</span></td>
          <td class="actions-cell">
            <button class="btn-icon" data-action="edit" data-id="${u.id}" title="${i18n.get('#admin-edit#')}">
              <span class="material-symbols-rounded">edit</span>
            </button>
            <button class="btn-icon btn-icon-danger" data-action="delete" data-id="${u.id}" data-name="${escHtml(u.username)}" title="${i18n.get('#admin-delete#')}">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </td>
        `
        tbody.appendChild(tr)
      })

      tbody.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id))
      })
      tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => confirmDelete(btn.dataset.id, btn.dataset.name))
      })
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    // ── 데이터 로드 ──
    async function loadUsers(search = '') {
      const tbody = document.getElementById('userTableBody')
      tbody.innerHTML = `<tr><td colspan="6" class="table-loading">${i18n.get('#admin-loading#')}</td></tr>`
      const params = new URLSearchParams({ max: 100 })
      if (search) params.set('search', search)
      const res = await fetch(`/api/admin/users?${params}`)
      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="6" class="table-empty">오류가 발생했습니다.</td></tr>`
        return
      }
      const data = await res.json()

      renderUsers(data.users)
    }

    // ── 검색 ──
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => loadUsers(document.getElementById('searchInput').value.trim()), 350)
    })

    // ── 모달 열기/닫기 ──
    function applyRoleOptions() {
      const isTeacher = currentUser?.role === 'teacher'
      const roleSelect = document.getElementById('inputRole')
      // teacher는 student만 생성 가능
      Array.from(roleSelect.options).forEach(opt => {
        opt.hidden = isTeacher && opt.value !== 'student'
      })
      if (isTeacher) roleSelect.value = 'student'
    }

    function applyGroupField(selectedGroupId = '') {
      const isSchoolAdmin = currentUser?.role === 'school_admin'
      const wrap = document.getElementById('groupFieldWrap')
      wrap.style.display = isSchoolAdmin ? '' : 'none'
      if (isSchoolAdmin) {
        document.getElementById('inputGroup').value = selectedGroupId || ''
      }
    }

    function openAddModal() {
      editingUserId = null
      document.getElementById('userModalTitle').textContent = i18n.get('#admin-modal_add_title#')
      document.getElementById('btnUserModalSave').textContent = i18n.get('#admin-create#')
      document.getElementById('inputUsername').value = ''
      document.getElementById('inputEmail').value = ''
      document.getElementById('inputFirstname').value = ''
      document.getElementById('inputLastname').value = ''
      document.getElementById('inputPassword').value = ''
      document.getElementById('inputPassword').placeholder = ''
      document.getElementById('inputEnabled').checked = true
      document.getElementById('inputUsername').disabled = false
      applyRoleOptions()
      applyGroupField()
      document.getElementById('userModalOverlay').classList.add('open')
      document.getElementById('inputUsername').focus()
    }

    async function openEditModal(userId) {
      editingUserId = userId
      document.getElementById('userModalTitle').textContent = i18n.get('#admin-modal_edit_title#')
      document.getElementById('btnUserModalSave').textContent = i18n.get('#admin-save#')
      document.getElementById('inputPassword').placeholder = i18n.get('#admin-password_placeholder#')

      const res = await fetch(`/api/admin/users/${userId}`)
      if (!res.ok) return
      const { user } = await res.json()

      document.getElementById('inputUsername').value = user.username || ''
      document.getElementById('inputUsername').disabled = true
      document.getElementById('inputEmail').value = user.email || ''
      document.getElementById('inputFirstname').value = user.firstName || ''
      document.getElementById('inputLastname').value = user.lastName || ''
      document.getElementById('inputPassword').value = ''
      const role = (user.realmRoles || []).find(r => ['school_admin','teacher','student'].includes(r)) || 'student'
      document.getElementById('inputRole').value = role
      document.getElementById('inputEnabled').checked = !!user.enabled
      applyRoleOptions()
      const currentGroupId = user.groups?.[0]?.id || ''
      applyGroupField(currentGroupId)
      document.getElementById('userModalOverlay').classList.add('open')
    }

    function closeUserModal() {
      document.getElementById('userModalOverlay').classList.remove('open')
      document.getElementById('inputUsername').disabled = false
    }

    document.getElementById('btnAddUser').addEventListener('click', openAddModal)
    document.getElementById('btnUserModalCancel').addEventListener('click', closeUserModal)

    // ── 저장 ──
    document.getElementById('btnUserModalSave').addEventListener('click', saveUser)

    async function saveUser() {
      if (isSaving) return
      const username = document.getElementById('inputUsername').value.trim()
      const password = document.getElementById('inputPassword').value
      const role = document.getElementById('inputRole').value

      if (!editingUserId && (!username || !password)) {
        document.getElementById(username ? 'inputPassword' : 'inputUsername').focus()
        return
      }

      isSaving = true
      const isSchoolAdmin = currentUser?.role === 'school_admin'
      const body = {
        username,
        email: document.getElementById('inputEmail').value.trim(),
        firstName: document.getElementById('inputFirstname').value.trim(),
        lastName: document.getElementById('inputLastname').value.trim(),
        role,
        enabled: document.getElementById('inputEnabled').checked,
      }
      if (password) body.password = password
      // school_admin: 선택한 그룹 ID 전송 / teacher: 서버에서 세션 그룹 자동 할당
      if (isSchoolAdmin) {
        body.groupId = document.getElementById('inputGroup').value || null
      }

      const url = editingUserId ? `/api/admin/users/${editingUserId}` : '/api/admin/users'
      const method = editingUserId ? 'PUT' : 'POST'

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      isSaving = false

      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        alert(data.error || '저장에 실패했습니다.')
        return
      }

      closeUserModal()
      loadUsers(document.getElementById('searchInput').value.trim())
    }

    // ── 삭제 ──
    function confirmDelete(userId, username) {
      const overlay = document.getElementById('deleteModalOverlay')
      overlay.classList.add('open')

      function onConfirm() {
        fetch(`/api/admin/users/${userId}`, { method: 'DELETE' })
          .then(res => {
            if (!res.ok) return res.json().then(d => { throw new Error(d.error) })
          })
          .then(() => loadUsers(document.getElementById('searchInput').value.trim()))
          .catch(err => alert(err.message || '삭제에 실패했습니다.'))
        cleanup()
      }
      function cleanup() {
        overlay.classList.remove('open')
        document.getElementById('btnDeleteConfirm').removeEventListener('click', onConfirm)
        document.getElementById('btnDeleteCancel').removeEventListener('click', cleanup)
        overlay.removeEventListener('click', onOverlayClick)
      }
      function onOverlayClick(e) {
        if (e.target === overlay) cleanup()
      }

      document.getElementById('btnDeleteConfirm').addEventListener('click', onConfirm)
      document.getElementById('btnDeleteCancel').addEventListener('click', cleanup)
      overlay.addEventListener('click', onOverlayClick)
    }

    ;(async () => {
      const user = await initHeader(i18n.get('#admin-title#'))
      if (user) currentUser = user
      if (currentUser?.role === 'school_admin') await loadGroups()
      loadUsers()
    })()
  </script>
</body>
</html>
