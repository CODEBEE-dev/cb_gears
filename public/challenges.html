<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="codebridgeai_favicon.png">
  <title>도전 과제 - Codebridge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>

  <style>
    /* ── 진행 바 ── */
    .progress-bar-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.8rem;
      padding: 1rem 1.2rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
    }
    .progress-bar-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-text);
      white-space: nowrap;
    }
    #progressBarTrack {
      flex: 1;
      height: 10px;
      background: var(--color-border);
      border-radius: 99px;
      overflow: hidden;
    }
    #progressBarFill {
      height: 100%;
      background: #22c55e;
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    #progressText {
      font-size: 0.82rem;
      font-weight: 700;
      color: #555;
      white-space: nowrap;
    }

    /* ── 콘텐츠 영역 ── */
    .challenges-content {
      flex: 1;
      overflow-y: auto;
    }

    .challenges-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    /* ── Category ── */
    .category { margin-bottom: 2.5rem; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .category-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--color-primary);
    }
    .category-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 99px;
      padding: 1px 8px;
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    /* ── Challenge Card ── */
    .challenge-card {
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 10px;
      padding: 14px 10px 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      position: relative;
      user-select: none;
    }
    .challenge-card:hover:not(.locked) {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,.1);
    }
    .challenge-card.locked { cursor: default; opacity: 0.5; }
    .challenge-card.done { border-color: #22c55e; background: #f0fdf4; }
    .challenge-card.next {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,.2);
    }
    .card-number { font-size: 0.65rem; font-weight: 700; color: #aaa; margin-bottom: 4px; }
    .card-title { font-size: 0.72rem; font-weight: 700; color: #334155; line-height: 1.3; word-break: keep-all; }

    .card-badge {
      position: absolute;
      top: -7px; right: -7px;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-badge .material-symbols-rounded { font-size: 12px; color: #fff; }
    .card-badge.done-badge { background: #22c55e; }
    .card-badge.lock-badge { background: #9aa5b4; }
    .card-badge.next-badge { background: #f59e0b; }

    /* ── 로딩 ── */
    #loadingMsg { text-align: center; padding: 4rem; color: #888; font-weight: 600; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      :root { --activity-bar-expanded: 160px; }

      .challenges-inner {
        padding: 1.2rem 1rem 3rem;
      }

      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      }
    }

    @media (max-width: 480px) {
      header .appName { display: none; }

      .activity-bar,
      .activity-bar.expanded {
        width: var(--activity-bar-collapsed);
        min-width: var(--activity-bar-collapsed);
      }

      .activity-label { display: none; }

      .challenges-inner {
        padding: 1rem 0.75rem 3rem;
      }

      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
      }
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--color-surface);
      border-radius: 14px;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 1.1rem; font-weight: 800; color: var(--color-primary); margin-bottom: 0.5rem; }
    .modal p { font-size: 0.87rem; color: #555; line-height: 1.6; margin-bottom: 1.25rem; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-family: inherit; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-secondary { background: var(--color-bg); color: #555; }
  </style>
</head>
<body>

<header id="appHeader"></header>

<main>
  <nav class="activity-bar expanded" id="activityBar"></nav>

  <div class="challenges-content">
    <div class="challenges-inner">
      <div class="progress-bar-area">
        <span class="progress-bar-label">전체 진행률</span>
        <div id="progressBarTrack"><div id="progressBarFill"></div></div>
        <span id="progressText">0 / 0</span>
      </div>
      <div id="challengeRoot">
        <div id="loadingMsg"></div>
      </div>
    </div>
  </div>
</main>

<!-- 챌린지 시작 모달 -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <h2 id="modalTitle">챌린지 이름</h2>
    <p id="modalDesc">설명</p>
    <div class="modal-buttons">
      <button class="btn btn-secondary" id="modalCancel"></button>
      <button class="btn btn-primary" id="modalStart"></button>
    </div>
  </div>
</div>

<script src="js/challengeData.js"></script>
<script>
  let currentChallenge = null;

  document.getElementById('loadingMsg').textContent = i18n.get('#ch-loading#')
  document.getElementById('modalCancel').textContent = i18n.get('#ch-cancel#')
  document.getElementById('modalStart').textContent = i18n.get('#ch-start#')

  initHeader(i18n.get('#nav-challenges#'))

  // ── 진행도 로드 후 렌더링 ────────────────────────────────────
  async function loadAndRender() {
    try {
      const res = await fetch('/api/challenges/progress');
      if (res.status === 401) {
        window.location.href = '/auth/login';
        return;
      }
      const data = await res.json();
      const progress = {};
      data.progress.forEach(row => { progress[row.challenge_id] = true; });
      render(progress);
    } catch (e) {
      document.getElementById('loadingMsg').textContent = '진행도를 불러오지 못했습니다.';
    }
  }

  // ── 렌더링 ──────────────────────────────────────────────────
  function render(progress) {
    let maxDoneIdx = -1;
    ALL_CHALLENGE_IDS.forEach((id, i) => { if (progress[id]) maxDoneIdx = i; });
    const unlockedUpTo = maxDoneIdx + 1;

    const totalDone = Object.keys(progress).length;
    const total = ALL_CHALLENGE_IDS.length;

    document.getElementById('progressBarFill').style.width = (total ? (totalDone / total * 100) : 0) + '%';
    document.getElementById('progressText').textContent = totalDone + ' / ' + total;

    const root = document.getElementById('challengeRoot');
    root.innerHTML = '';

    let globalIdx = 0;
    CHALLENGE_CATEGORIES.forEach(cat => {
      const catDone = cat.challenges.filter(ch => progress[ch.id]).length;

      const section = document.createElement('div');
      section.className = 'category';
      section.innerHTML = `
        <div class="category-header">
          <span class="category-title">${cat.title}</span>
          <span class="category-count">${catDone} / ${cat.challenges.length}</span>
        </div>
        <div class="card-grid" id="grid-${cat.id}"></div>
      `;
      root.appendChild(section);

      const grid = section.querySelector('.card-grid');
      cat.challenges.forEach(ch => {
        const myIdx = globalIdx++;
        const isDone = !!progress[ch.id];
        const isNext = myIdx === unlockedUpTo;
        const isUnlocked = isDone || myIdx <= unlockedUpTo;

        const card = document.createElement('div');
        card.className = 'challenge-card' +
          (isDone ? ' done' : '') +
          (!isUnlocked ? ' locked' : '') +
          (isNext ? ' next' : '');

        let badgeHtml = '';
        if (isDone) {
          badgeHtml = `<div class="card-badge done-badge"><span class="material-symbols-rounded">check</span></div>`;
        } else if (!isUnlocked) {
          badgeHtml = `<div class="card-badge lock-badge"><span class="material-symbols-rounded">lock</span></div>`;
        } else if (isNext) {
          badgeHtml = `<div class="card-badge next-badge"><span class="material-symbols-rounded">play_arrow</span></div>`;
        }

        card.innerHTML = `
          ${badgeHtml}
          <div class="card-number">#${myIdx + 1}</div>
          <div class="card-title">${ch.title}</div>
        `;
        if (isUnlocked) {
          card.addEventListener('click', () => openModal(ch, isDone));
        }
        grid.appendChild(card);
      });
    });
  }

  // ── 모달 ────────────────────────────────────────────────────
  function openModal(ch, isDone) {
    currentChallenge = ch;
    document.getElementById('modalTitle').textContent = ch.title;
    document.getElementById('modalDesc').textContent = ch.desc + (isDone ? ' ' + i18n.get('#ch-done_label#') : '');
    document.getElementById('startModal').classList.add('open');
  }

  document.getElementById('modalCancel').addEventListener('click', () => {
    document.getElementById('startModal').classList.remove('open');
  });
  document.getElementById('startModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });
  document.getElementById('modalStart').addEventListener('click', () => {
    if (!currentChallenge) return;
    document.getElementById('startModal').classList.remove('open');
    launchChallenge(currentChallenge);
  });

  // ── 챌린지 실행 ─────────────────────────────────────────────
  function launchChallenge(ch) {
    const worldConfig = JSON.stringify({
      worldName: 'challenges_basic',
      options: { jsonFile: ch.json, useDefaultRobot: true }
    });
    const url = `/editor?worldScripts=challenges_basic&worldJSON=${encodeURIComponent(worldConfig)}&challenge=${ch.id}`;
    window.open(url, '_blank');
  }

  // ── 완료 알림 수신 ──────────────────────────────────────────
  const bc = new BroadcastChannel('cb_challenge_complete');
  bc.onmessage = (e) => {
    if (e.data && e.data.type === 'CHALLENGE_COMPLETE') loadAndRender();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadAndRender();
  });

  loadAndRender();
</script>
</body>
</html>
