<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="codebridgeai_favicon.png">

  <script src="js/common/config.js"></script>

  <!-- Google Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">

  <script src="js/msg.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>
  <script src="js/common/ui.js"></script>

  <title>Dashboard</title>
</head>

<body>
  <header id="appHeader"></header>

  <main>
    <nav class="activity-bar expanded" id="activityBar"></nav>
    <div class="container">
      <!-- Home 뷰 -->
      <div class="content" id="viewHome">
        <div class="shortcut-bar">
          <a href="/configurator" class="shortcut-card shortcut-card-robot">
            <div class="shortcut-card-icon">
              <span class="material-symbols-rounded">smart_toy</span>
            </div>
            <div class="shortcut-card-title" id="scRobotTitle"></div>
            <div class="shortcut-card-desc" id="scRobotDesc"></div>
          </a>
          <a href="/builder" class="shortcut-card shortcut-card-world">
            <div class="shortcut-card-icon">
              <span class="material-symbols-rounded">map</span>
            </div>
            <div class="shortcut-card-title" id="scWorldTitle"></div>
            <div class="shortcut-card-desc" id="scWorldDesc"></div>
          </a>
          <a href="/challenges" class="shortcut-card shortcut-card-challenge">
            <div class="shortcut-card-icon">
              <span class="material-symbols-rounded">emoji_events</span>
            </div>
            <div class="shortcut-card-title" id="scChallengeTitle"></div>
            <div class="shortcut-card-desc" id="scChallengeDesc"></div>
          </a>
        </div>
        <div class="content-header">
          <h2 class="section-title" id="recentTitle"></h2>
          <button class="btn-new" id="btnNewProject">
            <span class="material-symbols-rounded">add</span>
            <span id="labelNewProject"></span>
          </button>
        </div>
        <div class="project-list" id="recentList"></div>
      </div>
    </div>
  </main>

  <!-- 로그인 안내 모달 -->
  <div class="modal-overlay" id="loginModalOverlay">
    <div class="modal">
      <h2 id="loginModalTitle"></h2>
      <p id="loginModalDesc" style="margin:0; font-size:0.9rem; color:#666;"></p>
      <div class="modal-actions">
        <button class="btn-create" id="btnLoginModalConfirm"></button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal">
      <h2 id="deleteModalTitle"></h2>
      <p id="deleteModalDesc" style="margin:0; font-size:0.9rem; color:#666;"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDeleteCancel"></button>
        <button class="btn-delete-confirm" id="btnDeleteConfirm"></button>
      </div>
    </div>
  </div>

  <!-- 새 프로젝트 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <label>
        <span id="labelName"></span>
        <input type="text" id="inputName" maxlength="100">
      </label>
      <p id="inputNameError" style="margin:0.3rem 0 0; font-size:0.82rem; color:#c62828; display:none;"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel"></button>
        <button class="btn-create" id="btnCreate"></button>
      </div>
    </div>
  </div>

  <script>
    // ── i18n ──
    document.getElementById('scRobotTitle').textContent     = i18n.get('#dash-shortcut_robot_title#')
    document.getElementById('scRobotDesc').textContent      = i18n.get('#dash-shortcut_robot_desc#')
    document.getElementById('scWorldTitle').textContent     = i18n.get('#dash-shortcut_world_title#')
    document.getElementById('scWorldDesc').textContent      = i18n.get('#dash-shortcut_world_desc#')
    document.getElementById('scChallengeTitle').textContent = i18n.get('#nav-challenges#')
    document.getElementById('scChallengeDesc').textContent  = i18n.get('#dash-shortcut_challenge_desc#')
    document.getElementById('recentTitle').textContent      = i18n.get('#dash-recent_projects#')
    document.getElementById('labelNewProject').textContent = i18n.get('#dash-new_project#')
    document.getElementById('modalTitle').textContent = i18n.get('#dash-modal_title#')
    document.getElementById('labelName').textContent = i18n.get('#dash-project_name#')
    document.getElementById('inputName').placeholder = i18n.get('#dash-project_name_placeholder#')
    document.getElementById('btnCancel').textContent = i18n.get('#dash-cancel#')
    document.getElementById('btnCreate').textContent = i18n.get('#dash-create#')
    document.getElementById('loginModalTitle').textContent = i18n.get('#dash-login_modal_title#')
    document.getElementById('loginModalDesc').textContent = i18n.get('#dash-login_modal_desc#')
    document.getElementById('btnLoginModalConfirm').textContent = i18n.get('#dash-confirm#')
    document.getElementById('deleteModalTitle').textContent = i18n.get('#dash-delete_confirm#')
    document.getElementById('deleteModalDesc').textContent = i18n.get('#dash-delete_desc#')
    document.getElementById('btnDeleteCancel').textContent = i18n.get('#dash-cancel#')
    document.getElementById('btnDeleteConfirm').textContent = i18n.get('#dash-delete#')

    // ── 상태 ──
    let currentUser = null
    let isCreating = false

    // ── 유틸 ──
    function openEditor(projectId) {
      window.location.href = `/editor?projectId=${projectId}`
    }

    function deleteProject(projectId, item) {
      openConfirmModal('deleteModalOverlay', 'btnDeleteConfirm', 'btnDeleteCancel', () => {
        fetch(`/api/projects/${projectId}`, { method: 'DELETE' }).then(() => item.remove())
      })
    }

    function makeProjectItem(p) {
      const item = document.createElement('div')
      item.className = 'project-item'
      item.innerHTML = `
        <span class="material-symbols-rounded project-item-icon">folder</span>
        <span class="project-item-name">${p.name}</span>
        <span class="project-item-date">${new Date(p.updated_at).toLocaleDateString()}</span>
        <button class="btn-delete" title="${i18n.get('#dash-delete_confirm#')}">
          <span class="material-symbols-rounded">delete</span>
        </button>
      `
      item.addEventListener('click', () => openEditor(p.id))
      item.querySelector('.btn-delete').addEventListener('click', (e) => {
        e.stopPropagation()
        deleteProject(p.id, item)
      })
      return item
    }

    function renderList(listEl, projects) {
      listEl.innerHTML = ''
      if (projects.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">${i18n.get('#dash-no_projects#')}</div>`
        return
      }
      projects.forEach(p => listEl.appendChild(makeProjectItem(p)))
    }

    function renderLoginRequired(listEl) {
      listEl.innerHTML = `<div class="empty-msg">${i18n.get('#dash-login_required#')}</div>`
    }

    // ── 데이터 로드 ──
    async function loadRecent() {
      const listEl = document.getElementById('recentList')
      listEl.innerHTML = `<div class="empty-msg">${i18n.get('#admin-loading#')}</div>`
      try {
        const res = await fetch('/api/projects')
        if (!res.ok) {
          if (res.status === 401) { renderLoginRequired(listEl); return }
          throw new Error(res.status)
        }
        const data = await res.json()
        renderList(listEl, data.projects)
      } catch (e) {
        listEl.innerHTML = `<div class="empty-msg" style="cursor:pointer;" id="recentRetry">${i18n.get('#ch-load_error#')}</div>`
        document.getElementById('recentRetry')?.addEventListener('click', loadRecent)
      }
    }


    // ── 모달 ──
    function openNewProjectModal() {
      if (!currentUser) {
        document.getElementById('loginModalOverlay').classList.add('open')
        return
      }
      document.getElementById('inputName').value = ''
      document.getElementById('modalOverlay').classList.add('open')
      document.getElementById('inputName').focus()
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open')
      document.getElementById('inputNameError').style.display = 'none'
    }

    document.getElementById('btnNewProject').addEventListener('click', openNewProjectModal)
    document.getElementById('btnCancel').addEventListener('click', closeModal)
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal()
    })
    document.getElementById('inputName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createProject()
    })
    document.getElementById('btnCreate').addEventListener('click', createProject)

    document.getElementById('btnLoginModalConfirm').addEventListener('click', () => {
      document.getElementById('loginModalOverlay').classList.remove('open')
    })
    document.getElementById('loginModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('loginModalOverlay'))
        document.getElementById('loginModalOverlay').classList.remove('open')
    })

    async function createProject() {
      if (isCreating) return
      const name = document.getElementById('inputName').value.trim()
      const errorEl = document.getElementById('inputNameError')
      errorEl.style.display = 'none'
      if (!name) { document.getElementById('inputName').focus(); return }
      isCreating = true
      const res = await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      })
      isCreating = false
      if (res.ok) {
        const data = await res.json()
        closeModal()
        openEditor(data.project.id)
      } else if (res.status === 409) {
        errorEl.textContent = i18n.get('#dash-duplicate_name#')
        errorEl.style.display = ''
        document.getElementById('inputName').focus()
      }
    }

    ;(async () => {
      const user = await initHeader(i18n.get('#nav-home#'))
      if (user) {
        currentUser = user
        loadRecent()
      } else {
        renderLoginRequired(document.getElementById('recentList'))
      }
    })()
  </script>
</body>
</html>
