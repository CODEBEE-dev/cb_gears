<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="codebridgeai_favicon.png">
  <title>Codebridge - 도전 과제</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <style>
    :root {
      --color-primary: #2634a3;
      --color-primary-light: #4a5fd4;
      --color-bg: #E4F0FE;
      --color-locked: #9aa5b4;
      --color-done: #22c55e;
      --color-active: #f59e0b;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--color-bg);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header img { width: 32px; height: 32px; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; }
    #progressBar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    #progressBarFill {
      width: 160px;
      height: 10px;
      background: rgba(255,255,255,.25);
      border-radius: 99px;
      overflow: hidden;
    }
    #progressBarFill div {
      height: 100%;
      background: var(--color-done);
      border-radius: 99px;
      transition: width .4s ease;
    }
    #resetBtn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }
    #resetBtn:hover { background: rgba(255,255,255,.3); }

    /* ── Main ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    /* ── Category ── */
    .category {
      margin-bottom: 2.5rem;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .category-icon {
      font-size: 1.5rem;
    }
    .category-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--color-primary);
    }
    .category-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: #666;
      background: #fff;
      border-radius: 99px;
      padding: 2px 8px;
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    /* ── Challenge Card ── */
    .challenge-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 14px 10px 12px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      position: relative;
      user-select: none;
    }
    .challenge-card:hover:not(.locked) {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .challenge-card.locked {
      cursor: default;
      opacity: .55;
      filter: grayscale(.6);
    }
    .challenge-card.done {
      border-color: var(--color-done);
      background: #f0fdf4;
    }
    .challenge-card.active-next {
      border-color: var(--color-active);
      box-shadow: 0 0 0 3px rgba(245,158,11,.25);
    }

    .card-emoji {
      font-size: 1.8rem;
      margin-bottom: 6px;
      display: block;
    }
    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #334155;
      line-height: 1.3;
      word-break: keep-all;
    }
    .card-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }
    .card-badge.done-badge {
      background: var(--color-done);
      color: #fff;
    }
    .card-badge.lock-badge {
      background: var(--color-locked);
      color: #fff;
    }
    .card-badge.next-badge {
      background: var(--color-active);
      color: #fff;
    }
    .material-symbols-rounded { font-size: 14px; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
    .modal h2 { font-size: 1.2rem; font-weight: 800; color: var(--color-primary); margin-bottom: 0.5rem; }
    .modal p { font-size: 0.88rem; color: #555; margin-bottom: 1.25rem; line-height: 1.6; }
    .modal-buttons { display: flex; gap: 8px; justify-content: center; }
    .btn {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #333; }

    /* ── Reset confirm modal ── */
    #confirmModal .modal { border: 3px solid #ef4444; }
    #confirmModal h2 { color: #ef4444; }
  </style>
</head>

<header>
  <img src="codebridgeai_favicon.png" alt="logo">
  <h1>도전 과제</h1>
  <div id="progressBar">
    <div id="progressBarFill"><div id="progressBarInner" style="width:0%"></div></div>
    <span id="progressText">0 / 0</span>
  </div>
  <button id="resetBtn">초기화</button>
</header>

<main id="challengeRoot"></main>

<!-- Challenge start modal -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <div class="modal-emoji" id="modalEmoji">🤖</div>
    <h2 id="modalTitle">도전 과제 이름</h2>
    <p id="modalDesc">설명이 여기에 표시됩니다.</p>
    <div class="modal-buttons">
      <button class="btn btn-secondary" id="modalCancel">취소</button>
      <button class="btn btn-primary" id="modalStart">시작하기 →</button>
    </div>
  </div>
</div>

<!-- Reset confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-emoji">⚠️</div>
    <h2>진행 상황 초기화</h2>

    <div class="modal-buttons">

      <button class="btn" style="background:#ef4444;color:#fff;" id="confirmYes">초기화</button>

  </div>
</div>

// ── 완료 코드 → challenge id 매핑 ──────────────────────────────
const CODE_TO_ID = {};
CATEGORIES.forEach(cat => {
  cat.challenges.forEach(ch => {
    CODE_TO_ID[ch.code.toUpperCase()] = ch.id;
  });
});

// ── localStorage helpers ──────────────────────────────────────
const STORAGE_KEY = 'cb_challenges_progress';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

// ── 전체 challenge id 순서 (잠금 판별용) ──────────────────────
const ALL_IDS = [];
CATEGORIES.forEach(cat => cat.challenges.forEach(ch => ALL_IDS.push(ch.id)));

function getFirstUnlocked(progress) {
  // 첫 번째는 항상 열려있음. 완료된 것의 다음 하나가 열려있음.
  // → 완료된 마지막 인덱스 + 1 까지 잠금 해제
  let maxDoneIdx = -1;
  ALL_IDS.forEach((id, i) => { if (progress[id]) maxDoneIdx = i; });
  return maxDoneIdx + 1; // 이 인덱스까지(포함) unlock
}

// ── 렌더링 ────────────────────────────────────────────────────
function render() {
  const progress = loadProgress();
  const unlockedUpTo = getFirstUnlocked(progress); // 이 인덱스까지 unlock

  let totalDone = Object.keys(progress).filter(k => progress[k]).length;
  let total = ALL_IDS.length;

  // progress bar
  document.getElementById('progressBarInner').style.width = (total ? (totalDone/total*100) : 0) + '%';
  document.getElementById('progressText').textContent = totalDone + ' / ' + total;

  const root = document.getElementById('challengeRoot');
  root.innerHTML = '';

  let globalIdx = 0;
  CATEGORIES.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category';

    // 카테고리 내 완료 수
    const catDone = cat.challenges.filter(ch => progress[ch.id]).length;

    section.innerHTML = `
      <div class="category-header">
        <span class="category-icon">${cat.icon}</span>
        <span class="category-title">${cat.title}</span>
        <span class="category-count">${catDone} / ${cat.challenges.length}</span>
      </div>
      <div class="card-grid" id="grid-${cat.id}"></div>
    `;
    root.appendChild(section);

    const grid = section.querySelector('.card-grid');

    cat.challenges.forEach(ch => {
      const myIdx = globalIdx;
      globalIdx++;

      const isDone = !!progress[ch.id];
      const isNext = myIdx === unlockedUpTo;
      const isUnlocked = isDone || myIdx <= unlockedUpTo;

      const card = document.createElement('div');
      card.className = 'challenge-card' +
        (isDone ? ' done' : '') +
        (!isUnlocked ? ' locked' : '') +
        (isNext ? ' active-next' : '');
      card.dataset.id = ch.id;

      let badgeHtml = '';
      if (isDone) {
        badgeHtml = `<div class="card-badge done-badge"><span class="material-symbols-rounded">check</span></div>`;
      } else if (!isUnlocked) {
        badgeHtml = `<div class="card-badge lock-badge"><span class="material-symbols-rounded">lock</span></div>`;
      } else if (isNext) {
        badgeHtml = `<div class="card-badge next-badge"><span class="material-symbols-rounded">play_arrow</span></div>`;
      }

      card.innerHTML = `
        ${badgeHtml}
        <span class="card-emoji">${ch.emoji}</span>
        <div class="card-title">${ch.title}</div>
      `;

      if (isUnlocked) {
        card.addEventListener('click', () => openModal(ch, isDone));
      }

      grid.appendChild(card);
    });
  });
}

// ── 모달 ──────────────────────────────────────────────────────
let currentChallenge = null;

function openModal(ch, isDone) {
  currentChallenge = ch;
  document.getElementById('modalEmoji').textContent = ch.emoji;
  document.getElementById('modalTitle').textContent = ch.title;
  document.getElementById('modalDesc').innerHTML =
    ch.desc +
    (isDone ? `<br><br>✅ 완료! 완료 코드: <strong>${ch.code}</strong>` : '');
  document.getElementById('startModal').classList.add('open');
}

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('startModal').classList.remove('open');
});
document.getElementById('startModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

document.getElementById('modalStart').addEventListener('click', () => {
  if (!currentChallenge) return;
  document.getElementById('startModal').classList.remove('open');
  launchChallenge(currentChallenge);
});

// ── 챌린지 실행 ───────────────────────────────────────────────
function launchChallenge(ch) {
  // loadWorld()가 기대하는 형식: { worldName, options: { jsonFile, useDefaultRobot } }
  const worldConfig = JSON.stringify({
    worldName: 'challenges_basic',
    options: {
      jsonFile: ch.json,
      useDefaultRobot: true
    }
  });
  const worldJSON = encodeURIComponent(worldConfig);
  const url = `index.html?worldScripts=challenges_basic&worldJSON=${worldJSON}&challenge=${ch.id}`;
  // 새 탭으로 열어서 challenges.html을 유지 → BroadcastChannel 수신 가능
  window.open(url, '_blank');
}

// ── 완료 코드 감지 ────────────────────────────────────────────
// 방법 1: BroadcastChannel (새 탭의 index.html에서 완료 시 즉시 수신)
const bc = new BroadcastChannel('cb_challenge_complete');
bc.onmessage = (e) => {
  if (e.data && e.data.type === 'CHALLENGE_COMPLETE') {
    const { code } = e.data;
    const cid = CODE_TO_ID[code.toUpperCase()];
    if (cid) {
      const p = loadProgress();
      p[cid] = true;
      saveProgress(p);
      render();
    }
  }
};

// 방법 2: localStorage 변경 감지 (다른 탭에서 저장하면 발생)
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) {
    render();
  }
});

// 방법 3: 탭이 다시 활성화될 때 재렌더링 (사용자가 직접 탭 전환 시)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    render();
  }
});

// ── 초기화 버튼 ───────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.add('open');
});
document.getElementById('confirmNo').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('open');
});
document.getElementById('confirmYes').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('confirmModal').classList.remove('open');
  render();
});

// ── 초기 렌더링 ───────────────────────────────────────────────
render();
</script>
