<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="codebridgeai_favicon.png">
  <title>Classroom - Codebridge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/msg.js"></script>
  <script src="js/challengeData.js"></script>
  <script src="js/common/activityBar.js"></script>
  <script src="js/common/header.js"></script>
  <script src="js/common/ui.js"></script>

  <style>
    /* ── 그룹 배지 ── */
    .group-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }
    .group-badge .material-symbols-rounded {
      font-size: 1rem;
      color: var(--color-primary);
    }

    /* ── 탭 ── */

    /* ── 공지사항 ── */
    .announcement-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .announcement-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 1rem 1.2rem;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .announcement-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .announcement-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .announcement-card-title {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--color-text);
      flex: 1;
    }
    .announcement-card-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem;
      border-radius: 0.4rem;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      transition: color 0.15s, background 0.15s;
    }
    .btn-icon:hover { color: var(--color-primary); background: var(--color-bg); }
    .btn-icon.danger:hover { color: #c62828; background: #fef2f2; }
    .announcement-card-meta {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
    }
    .announcement-card-body {
      margin-top: 0.6rem;
      font-size: 0.88rem;
      color: var(--color-text);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ── 리더보드 ── */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid var(--color-border);
    }
    .leaderboard-table th {
      background: var(--color-bg);
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-text-muted);
      text-align: left;
      border-bottom: 1px solid var(--color-border);
    }
    .leaderboard-table td {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--color-border);
    }
    .leaderboard-table tr:last-child td { border-bottom: none; }
    .leaderboard-table tr:hover td { background: var(--color-bg); }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .rank-1 { background: #ffd700; color: #7a5800; }
    .rank-2 { background: #c0c0c0; color: #444; }
    .rank-3 { background: #cd7f32; color: #fff; }
    .rank-other { background: var(--color-bg); color: var(--color-text-muted); }
    .progress-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      background: var(--color-border);
      border-radius: 4px;
      overflow: hidden;
      min-width: 80px;
    }
    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .progress-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-text);
      min-width: 3rem;
      text-align: right;
    }

    /* ── 학생 프로젝트 ── */
    .student-search-wrap {
      margin-bottom: 1rem;
      position: relative;
    }
    .student-search-wrap .material-symbols-rounded {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--color-text-muted);
      pointer-events: none;
    }
    .student-search {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--color-surface);
      color: var(--color-text);
    }
    .student-search:focus { outline: none; border-color: var(--color-primary); }
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .student-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .student-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.2rem;
      background: #f0f2fa;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      user-select: none;
    }
    .student-section-header:hover { background: #e8eaff; }
    .student-section-header .material-symbols-rounded { color: var(--color-text-muted); }
    .student-section-header .material-symbols-rounded {
      font-size: 1.1rem;
      color: var(--color-text-muted);
      transition: transform 0.2s;
    }
    .student-section.open .student-section-header .material-symbols-rounded {
      transform: rotate(180deg);
    }
    .student-section-body {
      display: none;
      border-top: 1px solid var(--color-border);
    }
    .student-section.open .student-section-body { display: block; }
    .student-project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.2rem;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.88rem;
    }
    .student-project-row:last-child { border-bottom: none; }
    .student-project-name {
      color: var(--color-text);
      flex: 1;
    }
    .student-project-date {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-right: 1rem;
    }
    .btn-view {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--color-primary);
      border-radius: 0.4rem;
      background: none;
      color: var(--color-primary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-view:hover { background: var(--color-primary); color: #fff; }

    /* ── 공지 작성 모달 ── */
    .modal textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
      margin-top: 0.25rem;
    }
    .modal textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .modal label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-text-muted);
      gap: 0;
      margin-bottom: 0.8rem;
    }
    .modal label input {
      margin-top: 0.25rem;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .modal label input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .empty-msg {
      text-align: center;
      color: var(--color-text-muted);
      padding: 2.5rem 0;
      font-size: 0.9rem;
    }

    /* ── 자료실 ── */
    .material-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .material-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 1rem 1.2rem;
    }
    .material-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .material-card-title {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--color-text);
      flex: 1;
    }
    .material-card-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }
    .material-card-meta {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
    }
    .material-card-body {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      color: var(--color-text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .material-files {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .material-file-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--color-text);
      transition: border-color 0.15s, background 0.15s;
    }
    .material-file-item:hover {
      border-color: var(--color-primary);
      background: var(--color-surface);
    }
    .material-file-item .material-symbols-rounded {
      font-size: 1.1rem;
      color: var(--color-primary);
      flex-shrink: 0;
    }
    .material-file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .material-file-size {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    /* 자료 등록 모달 - 파일 첨부 영역 */
    .file-input-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border: 1px dashed var(--color-border);
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      transition: border-color 0.15s, color 0.15s;
      margin-top: 0.25rem;
    }
    .file-input-label:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .file-input-label .material-symbols-rounded { font-size: 1.1rem; }
    .selected-files {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .selected-file-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.83rem;
      color: var(--color-text);
    }
    .selected-file-item .material-symbols-rounded {
      font-size: 1rem;
      color: var(--color-text-muted);
    }
    .btn-remove-file {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      margin-left: auto;
      flex-shrink: 0;
    }
    .btn-remove-file:hover { color: #c62828; }
    .btn-remove-file .material-symbols-rounded { font-size: 1rem; }

    /* ── 수업 관리 / 내 수업 ── */
    .class-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .class-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .class-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .class-card-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .class-card-title {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--color-text);
      flex: 1;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-badge.active  { background: #e8f5e9; color: #2e7d32; }
    .status-badge.closed  { background: #f5f5f5; color: #9e9e9e; }
    .class-card-body {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1rem;
    }
    .class-card-thumb {
      width: 96px;
      min-width: 96px;
      height: 72px;
      object-fit: cover;
      border-radius: 0.5rem;
      background: #eef0fb;
      display: block;
    }
    .class-card-thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0aadd;
    }
    .class-card-thumb-placeholder .material-symbols-rounded { font-size: 2rem; }
    .class-card-info {
      flex: 1;
      min-width: 0;
    }
    .class-card-curriculum {
      font-size: 0.8rem;
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .class-card-meta {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 0.6rem;
    }
    .class-card-progress {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--color-text-muted);
      padding: 0;
      margin-bottom: 1rem;
    }
    .back-btn:hover { color: var(--color-primary); }
    .back-btn .material-symbols-rounded { font-size: 1.1rem; }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .detail-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--color-text);
      flex: 1;
    }
    .section-subtitle {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--color-text-muted);
      margin: 1.2rem 0 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .roster-list {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .roster-row {
      display: flex;
      align-items: center;
      padding: 0.65rem 1.2rem;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.88rem;
      gap: 0.5rem;
    }
    .roster-row:last-child { border-bottom: none; }
    .roster-name { flex: 1; font-weight: 600; }
    .roster-date { font-size: 0.78rem; color: var(--color-text-muted); }
    /* 차시 진도 매트릭스 */
    .lesson-matrix-wrap { overflow-x: auto; }
    .lesson-matrix {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid var(--color-border);
      font-size: 0.83rem;
    }
    .lesson-matrix th {
      background: var(--color-bg);
      padding: 0.6rem 0.75rem;
      font-weight: 700;
      color: var(--color-text-muted);
      text-align: center;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .lesson-matrix th:first-child { text-align: left; }
    .lesson-matrix td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--color-border);
      text-align: center;
    }
    .lesson-matrix td:first-child { text-align: left; font-weight: 600; }
    .lesson-matrix tr:last-child td { border-bottom: none; }
    .lesson-matrix tr:hover td { background: var(--color-bg); }
    .ls-icon { font-size: 1.1rem; }
    .ls-done  { color: #2e7d32; }
    .ls-prog  { color: #1565c0; }
    .ls-none  { color: #bdbdbd; }
    /* 학생 차시 카드 */
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .lesson-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      padding: 0.85rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .lesson-order {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .lesson-desc {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 0.1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lesson-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .btn-start {
      padding: 0.35rem 0.9rem;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-start:hover { opacity: 0.85; }
    .btn-continue {
      padding: 0.35rem 0.9rem;
      background: none;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      border-radius: 0.4rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-continue:hover { background: var(--color-primary); color: #fff; }
    .btn-complete {
      padding: 0.35rem 0.9rem;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #2e7d32;
      border-radius: 0.4rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-complete:hover { background: #c8e6c9; }
    .lesson-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .chip-done { background: #e8f5e9; color: #2e7d32; }
    .chip-prog { background: #e3f2fd; color: #1565c0; }
    .chip-none { background: #f5f5f5; color: #9e9e9e; }
    /* 수업 개설 모달 */
    .modal select {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      background: var(--color-surface);
      color: var(--color-text);
      margin-top: 0.25rem;
      box-sizing: border-box;
    }
    .modal select:focus { outline: none; border-color: var(--color-primary); }
    .btn-toggle-status {
      padding: 0.3rem 0.8rem;
      border-radius: 0.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .btn-toggle-status:hover { background: var(--color-border); }
  </style>
</head>

<body>
  <header id="appHeader"></header>

  <main>
    <nav class="activity-bar expanded" id="activityBar"></nav>
    <div class="container">
      <div class="content">

        <div class="content-header">
          <h2 class="section-title" id="pageTitle"></h2>
          <span class="group-badge" id="groupBadge" style="display:none;">
            <span class="material-symbols-rounded">group</span>
            <span id="groupBadgeLabel"></span>
          </span>
        </div>

        <!-- 탭 -->
        <div class="tab-bar">
          <!-- teacher 전용: 수업 관리 -->
          <button class="tab-btn" id="tabClassManage" style="display:none;">
            <span class="material-symbols-rounded">school</span>
            <span>수업 관리</span>
          </button>

  <script>
    // ── i18n ──
    document.getElementById('pageTitle').textContent           = i18n.get('#nav-classroom#')
    document.getElementById('labelNewAnnouncement').textContent = i18n.get('#classroom-new_announcement#')
    document.getElementById('tabLabelAnnouncements').textContent = i18n.get('#classroom-announcements#')
    document.getElementById('tabLabelLeaderboard').textContent      = i18n.get('#classroom-leaderboard#')
    document.getElementById('tabLabelMaterials').textContent        = i18n.get('#classroom-materials#')
    document.getElementById('tabLabelStudentProjects').textContent  = i18n.get('#classroom-student_projects#')
    document.getElementById('studentSearch').placeholder           = i18n.get('#classroom-search_student#')
    document.getElementById('labelNewMaterial').textContent        = i18n.get('#classroom-new_material#')
    document.getElementById('materialModalTitle').textContent      = i18n.get('#classroom-new_material#')
    document.getElementById('labelMaterialTitle').textContent      = i18n.get('#classroom-title#')
    document.getElementById('labelMaterialContent').textContent    = i18n.get('#classroom-content#')
    document.getElementById('labelAttachFiles').textContent        = i18n.get('#classroom-attach_files#')
    document.getElementById('labelAttachFilesBtn').textContent     = i18n.get('#classroom-attach_files#')
    document.getElementById('btnMaterialCancel').textContent       = i18n.get('#classroom-cancel#')
    document.getElementById('btnMaterialSubmit').textContent       = i18n.get('#classroom-post#')
    document.getElementById('inputMaterialTitle').placeholder      = i18n.get('#classroom-material_title_placeholder#')
    document.getElementById('inputMaterialContent').placeholder    = i18n.get('#classroom-material_content_placeholder#')
    document.getElementById('thRank').textContent      = i18n.get('#classroom-rank#')
    document.getElementById('thStudent').textContent   = i18n.get('#classroom-student#')
    document.getElementById('thCompleted').textContent = i18n.get('#classroom-completed#')
    document.getElementById('thProgress').textContent  = i18n.get('#classroom-progress#')
    document.getElementById('labelTitle').textContent   = i18n.get('#classroom-title#')
    document.getElementById('labelContent').textContent = i18n.get('#classroom-content#')
    document.getElementById('btnAnnouncementCancel').textContent = i18n.get('#classroom-cancel#')
    document.getElementById('btnDeleteCancel').textContent       = i18n.get('#classroom-cancel#')
    document.getElementById('btnDeleteConfirm').textContent      = i18n.get('#classroom-delete#')
    document.getElementById('deleteModalTitle').textContent      = i18n.get('#classroom-delete_confirm#')
    document.getElementById('inputTitle').placeholder   = i18n.get('#classroom-title_placeholder#')
    document.getElementById('inputContent').placeholder = i18n.get('#classroom-content_placeholder#')

    const TOTAL_CHALLENGES = ALL_CHALLENGE_IDS.length

    let currentUser = null
    let isTeacher = false
    let editingId = null

    // ── 탭 전환 ──
    const TAB_IDS = ['announcements', 'leaderboard', 'materials', 'student-projects', 'class-manage', 'my-class']
    const TAB_VIEW = {
      'announcements':    'viewAnnouncements',
      'leaderboard':      'viewLeaderboard',
      'materials':        'viewMaterials',
      'student-projects': 'viewStudentProjects',
      'class-manage':     'viewClassManage',
      'my-class':         'viewMyClass',
    }
    const TAB_BTN = {
      'announcements':    'tabAnnouncements',
      'leaderboard':      'tabLeaderboard',
      'materials':        'tabMaterials',
      'student-projects': 'tabStudentProjects',
      'class-manage':     'tabClassManage',
      'my-class':         'tabMyClass',
    }

    function switchTab(tab) {
      TAB_IDS.forEach(t => {
        document.getElementById(TAB_VIEW[t]).style.display = t === tab ? '' : 'none'
        document.getElementById(TAB_BTN[t]).classList.toggle('active', t === tab)
      })
      if (tab === 'announcements')    loadAnnouncements()
      if (tab === 'leaderboard')      loadLeaderboard()
      if (tab === 'materials')        loadMaterials()
      if (tab === 'student-projects') loadStudentProjects()
      if (tab === 'class-manage')     loadClassManage()
      if (tab === 'my-class')         loadMyClasses()
    }

    document.getElementById('tabAnnouncements').addEventListener('click',   () => switchTab('announcements'))
    document.getElementById('tabLeaderboard').addEventListener('click',     () => switchTab('leaderboard'))
    document.getElementById('tabMaterials').addEventListener('click',       () => switchTab('materials'))
    document.getElementById('tabStudentProjects').addEventListener('click', () => switchTab('student-projects'))
    document.getElementById('tabClassManage').addEventListener('click',     () => switchTab('class-manage'))
    document.getElementById('tabMyClass').addEventListener('click',         () => switchTab('my-class'))

    // ── 공지사항 ──
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
    }

    function makeAnnouncementCard(a) {
      const card = document.createElement('div')
      card.className = 'announcement-card'
      card.dataset.id = a.id

      const actionsHtml = isTeacher && currentUser.id === a.author_id
        ? `<div class="announcement-card-actions">
            <button class="btn-icon" data-action="edit" title="${i18n.get('#classroom-edit#')}">
              <span class="material-symbols-rounded">edit</span>
            </button>
            <button class="btn-icon danger" data-action="delete" title="${i18n.get('#classroom-delete#')}">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </div>`
        : ''

      card.innerHTML = `
        <div class="announcement-card-header">
          <div class="announcement-card-title">${escapeHtml(a.title)}</div>
          ${actionsHtml}
        </div>
        <div class="announcement-card-meta">${escapeHtml(a.author_name)} · ${formatDate(a.created_at)}</div>
        <div class="announcement-card-body">${escapeHtml(a.content)}</div>
      `


      // 수정/삭제 버튼
      card.querySelector('[data-action="edit"]')?.addEventListener('click', (e) => {
        e.stopPropagation()
        openAnnouncementModal(a)
      })
      card.querySelector('[data-action="delete"]')?.addEventListener('click', (e) => {
        e.stopPropagation()
        openDeleteModal(a.id, card)
      })

      return card
    }

    async function loadAnnouncements() {
      const listEl = document.getElementById('announcementList')
      listEl.innerHTML = ''
      try {
        const res = await fetch('/api/classroom/announcements')
        if (!res.ok) throw new Error(res.status)
        const { announcements } = await res.json()
        if (announcements.length === 0) {
          listEl.innerHTML = `<div class="empty-msg">${i18n.get('#classroom-no_announcements#')}</div>`
          return
        }
        announcements.forEach(a => listEl.appendChild(makeAnnouncementCard(a)))
      } catch {
        listEl.innerHTML = `<div class="empty-msg">${i18n.get('#ch-load_error#')}</div>`
      }
    }

    // ── 리더보드 ──
    async function loadLeaderboard() {
      const tbody = document.getElementById('leaderboardBody')
      tbody.innerHTML = ''
      try {
        const res = await fetch('/api/classroom/leaderboard')
        if (!res.ok) throw new Error(res.status)
        const { leaderboard } = await res.json()
        if (leaderboard.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">${i18n.get('#classroom-no_records#')}</td></tr>`
          return
        }
        leaderboard.forEach((row, idx) => {
          const rank = idx + 1
          const pct = TOTAL_CHALLENGES > 0 ? Math.round((row.completed / TOTAL_CHALLENGES) * 100) : 0
          const rankClass = rank <= 3 ? `rank-${rank}` : 'rank-other'
          const tr = document.createElement('tr')
          tr.innerHTML = `
            <td><span class="rank-badge ${rankClass}">${rank}</span></td>
            <td>${escapeHtml(row.user_name || '-')}</td>
            <td>${row.completed} / ${TOTAL_CHALLENGES}</td>
            <td>
              <div class="progress-cell">
                <div class="progress-track">
                  <div class="progress-fill" style="width:${pct}%"></div>
                </div>
                <span class="progress-label">${pct}%</span>
              </div>
            </td>
          `
          tbody.appendChild(tr)
        })
      } catch {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">${i18n.get('#ch-load_error#')}</td></tr>`
      }
    }

    // ── 학생 프로젝트 ──
    let allStudents = []
    const MAX_PROJECTS = 5

    function renderStudentList(students) {
      const listEl = document.getElementById('studentProjectList')
      listEl.innerHTML = ''
      if (students.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">${i18n.get('#classroom-no_projects#')}</div>`
        return
      }
      students.forEach(student => {
        const section = document.createElement('div')
        section.className = 'student-section'

        const header = document.createElement('div')
        header.className = 'student-section-header'
        header.innerHTML = `
          <span>${escapeHtml(student.user_name || student.user_id)}</span>
          <span class="material-symbols-rounded">expand_more</span>
        `
        header.addEventListener('click', () => section.classList.toggle('open'))
        section.appendChild(header)

        const body = document.createElement('div')
        body.className = 'student-section-body'

        const recentProjects = student.projects.slice(0, MAX_PROJECTS)
        if (recentProjects.length === 0) {
          body.innerHTML = `<div class="student-project-row"><span class="student-project-name" style="color:var(--color-text-muted)">${i18n.get('#classroom-no_projects#')}</span></div>`
        } else {
          recentProjects.forEach(proj => {
            const row = document.createElement('div')
            row.className = 'student-project-row'
            row.innerHTML = `
              <span class="student-project-name">${escapeHtml(proj.name)}</span>
              <span class="student-project-date">${formatDate(proj.updated_at)}</span>
              <button class="btn-view">${i18n.get('#classroom-open_project#')}</button>
            `
            row.querySelector('.btn-view').addEventListener('click', () => {
              window.open(`/editor?projectId=${proj.id}&readonly=true`, '_blank')
            })
            body.appendChild(row)
          })
        }

        section.appendChild(body)
        listEl.appendChild(section)
      })
    }

    async function loadStudentProjects() {
      const listEl = document.getElementById('studentProjectList')
      listEl.innerHTML = ''
      try {
        const res = await fetch('/api/classroom/student-projects')
        if (!res.ok) throw new Error(res.status)
        const { students } = await res.json()
        allStudents = students
        renderStudentList(allStudents)
      } catch {
        listEl.innerHTML = `<div class="empty-msg">${i18n.get('#ch-load_error#')}</div>`
      }
    }

    document.getElementById('studentSearch').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase()
      const filtered = q
        ? allStudents.filter(s => (s.user_name || s.user_id).toLowerCase().includes(q))
        : allStudents
      renderStudentList(filtered)
    })

    // ── 공지사항 모달 ──
    function openAnnouncementModal(existing = null) {
      editingId = existing ? existing.id : null
      document.getElementById('announcementModalTitle').textContent =
        i18n.get(existing ? '#classroom-edit#' : '#classroom-new_announcement#')
      document.getElementById('btnAnnouncementSubmit').textContent =
        i18n.get(existing ? '#classroom-edit#' : '#classroom-post#')
      document.getElementById('inputTitle').value   = existing ? existing.title   : ''
      document.getElementById('inputContent').value = existing ? existing.content : ''
      document.getElementById('announcementModalOverlay').classList.add('open')
      document.getElementById('inputTitle').focus()
    }

    function closeAnnouncementModal() {
      document.getElementById('announcementModalOverlay').classList.remove('open')
      editingId = null
    }

    // ── 자료실 ──
    function formatFileSize(bytes) {
      if (!bytes) return ''
      if (bytes < 1024) return `${bytes} B`
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`
    }

    function makeMaterialCard(m) {
      const card = document.createElement('div')
      card.className = 'material-card'
      card.dataset.id = m.id

      const actionsHtml = isTeacher && currentUser.id === m.author_id
        ? `<div class="material-card-actions">
            <button class="btn-icon danger" data-action="delete" title="${i18n.get('#classroom-delete#')}">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </div>`
        : ''

      const filesHtml = m.files && m.files.length > 0
        ? `<div class="material-files">
            ${m.files.map(f => `
              <a class="material-file-item" href="/api/classroom/materials/files/${f.id}/download">
                <span class="material-symbols-rounded">description</span>
                <span class="material-file-name">${escapeHtml(f.original_name)}</span>
                <span class="material-file-size">${formatFileSize(f.file_size)}</span>
                <span class="material-symbols-rounded" style="font-size:1rem;color:var(--color-text-muted);flex-shrink:0">download</span>
              </a>
            `).join('')}
          </div>`
        : ''

      const bodyHtml = m.content
        ? `<div class="material-card-body">${escapeHtml(m.content)}</div>`
        : ''

      card.innerHTML = `
        <div class="material-card-header">
          <div class="material-card-title">${escapeHtml(m.title)}</div>
          ${actionsHtml}
        </div>
        <div class="material-card-meta">${escapeHtml(m.author_name)} · ${formatDate(m.created_at)}</div>
        ${bodyHtml}
        ${filesHtml}
      `

      // 삭제 버튼
      card.querySelector('[data-action="delete"]')?.addEventListener('click', () => {
        openMaterialDeleteModal(m.id, card)
      })

      return card
    }

    async function loadMaterials() {
      const listEl = document.getElementById('materialList')
      listEl.innerHTML = ''
      try {
        const res = await fetch('/api/classroom/materials')
        if (!res.ok) throw new Error(res.status)
        const { materials } = await res.json()
        if (materials.length === 0) {
          listEl.innerHTML = `<div class="empty-msg">${i18n.get('#classroom-no_materials#')}</div>`
          return
        }
        materials.forEach(m => listEl.appendChild(makeMaterialCard(m)))
      } catch {
        listEl.innerHTML = `<div class="empty-msg">${i18n.get('#ch-load_error#')}</div>`
      }
    }

    // ── 자료 등록 모달 ──
    let selectedFiles = []

    function openMaterialModal() {
      selectedFiles = []
      document.getElementById('inputMaterialTitle').value = ''
      document.getElementById('inputMaterialContent').value = ''
      document.getElementById('inputMaterialFiles').value = ''
      document.getElementById('selectedFileList').innerHTML = ''
      document.getElementById('materialModalOverlay').classList.add('open')
      document.getElementById('inputMaterialTitle').focus()
    }

    function closeMaterialModal() {
      document.getElementById('materialModalOverlay').classList.remove('open')
      selectedFiles = []
    }

    function renderSelectedFiles() {
      const listEl = document.getElementById('selectedFileList')
      listEl.innerHTML = ''
      selectedFiles.forEach((file, idx) => {
        const item = document.createElement('div')
        item.className = 'selected-file-item'
        item.innerHTML = `
          <span class="material-symbols-rounded">description</span>
          <span>${escapeHtml(file.name)}</span>
          <span style="font-size:0.75rem;color:var(--color-text-muted);margin-left:0.3rem">${formatFileSize(file.size)}</span>
          <button class="btn-remove-file" data-idx="${idx}">
            <span class="material-symbols-rounded">close</span>
          </button>
        `
        item.querySelector('.btn-remove-file').addEventListener('click', () => {
          selectedFiles.splice(idx, 1)
          renderSelectedFiles()
        })
        listEl.appendChild(item)
      })
    }

    document.getElementById('inputMaterialFiles').addEventListener('change', (e) => {
      for (const file of e.target.files) selectedFiles.push(file)
      e.target.value = ''
      renderSelectedFiles()
    })

    document.getElementById('btnNewMaterial').addEventListener('click', openMaterialModal)
    document.getElementById('btnMaterialCancel').addEventListener('click', closeMaterialModal)
    document.getElementById('materialModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('materialModalOverlay')) closeMaterialModal()
    })

    document.getElementById('btnMaterialSubmit').addEventListener('click', async () => {
      const title   = document.getElementById('inputMaterialTitle').value.trim()
      const content = document.getElementById('inputMaterialContent').value.trim()
      if (!title) return

      const formData = new FormData()
      formData.append('title', title)
      formData.append('content', content)
      for (const file of selectedFiles) formData.append('files', file)

      const res = await fetch('/api/classroom/materials', { method: 'POST', body: formData })

        loadMaterials()

    const CMS_BASE = '/api/cms'
    let currentClassId = null
    let pendingStartClassId = null
    let pendingStartLessonId = null

    async function loadClassManage() {
      const listEl = document.getElementById('classListEl')
      listEl.innerHTML = ''
      document.getElementById('classListView').style.display = ''
      document.getElementById('classDetailView').style.display = 'none'
      try {
        const classRes = await fetch('/api/class')
        if (!classRes.ok) throw new Error(classRes.status)
        const { classes } = await classRes.json()
        if (classes.length === 0) {
          listEl.innerHTML = `<div class="empty-msg">개설된 수업이 없습니다.</div>`
          return
        }

        // 커리큘럼별 정보 맵 구성 (중복 요청 방지를 위해 unique id만 조회)
        const curriculumMap = {}
        const uniqueCurriculumIds = [...new Set(classes.map(c => c.api_curriculum_id).filter(Boolean))]
        await Promise.all(uniqueCurriculumIds.map(async id => {
          try {
            const r = await fetch(`${CMS_BASE}/curriculums/${id}`)
            if (!r.ok) return
            const { data } = await r.json()
            curriculumMap[id] = { title: data?.title || '', lessonCount: (data?.lessons || []).length, thumbnailUrl: data?.thumbnailUrl || '' }
          } catch { /* CMS 조회 실패 시 해당 반 커리큘럼 정보는 빈값으로 표시 */ }
        }))

        classes.forEach(cls => listEl.appendChild(makeClassCard(cls, curriculumMap)))
      } catch {
        listEl.innerHTML = `<div class="empty-msg">불러오기 실패</div>`
      }
    }

    function makeClassCard(cls, curriculumMap = {}) {
      const card = document.createElement('div')
      card.className = 'class-card'
      const curr = curriculumMap[cls.api_curriculum_id] || {}
      const totalLessons = curr.lessonCount || 0
      const totalCells = totalLessons * Number(cls.student_count || 0)
      const pct = totalCells > 0
        ? Math.min(100, Math.round(Number(cls.completed_lessons || 0) / totalCells * 100))
        : 0
      const statusLabel = cls.status === 'ACTIVE' ? '진행중' : '종료'
      const statusCls   = cls.status === 'ACTIVE' ? 'active' : 'closed'
      const thumbHtml = curr.thumbnailUrl
        ? `<img class="class-card-thumb" src="${curr.thumbnailUrl}" alt="" loading="lazy">`
        : `<div class="class-card-thumb class-card-thumb-placeholder"><span class="material-symbols-rounded">menu_book</span></div>`
      const curriculumLine = curr.title
        ? `<div class="class-card-curriculum">${escapeHtml(curr.title)} · ${totalLessons}차시</div>`
        : ''
      card.innerHTML = `
        <div class="class-card-body">
          ${thumbHtml}
          <div class="class-card-info">
            <div class="class-card-header">
              <div class="class-card-title">${escapeHtml(cls.title)}</div>
              <span class="status-badge ${statusCls}">${statusLabel}</span>
            </div>
            ${curriculumLine}
            <div class="class-card-meta">학생 ${cls.student_count}명</div>
            <div class="class-card-progress">
              <div class="progress-track" style="flex:1;">
                <div class="progress-fill" style="width:${pct}%"></div>
              </div>
              <span class="progress-label">${pct}%</span>
            </div>
          </div>
        </div>
      `
      card.addEventListener('click', () => showClassDetail(cls.id))
      return card
    }

    async function showClassDetail(classId) {
      currentClassId = classId
      document.getElementById('classListView').style.display = 'none'
      document.getElementById('classDetailView').style.display = ''

      const rosterEl = document.getElementById('rosterListEl')
      const matHead  = document.getElementById('lessonMatrixHead')
      const matBody  = document.getElementById('lessonMatrixBody')
      rosterEl.innerHTML = '<div class="empty-msg">불러오는 중...</div>'
      matHead.innerHTML = ''
      matBody.innerHTML = ''

      try {
        const [detailRes, cmsRes] = await Promise.all([
          fetch(`/api/class/${classId}`),
          fetch(`${CMS_BASE}/curriculums`),
        ])
        if (!detailRes.ok) throw new Error('detail')
        const { class: cls, roster, lessonProgress } = await detailRes.json()

        // 헤더
        document.getElementById('detailClassTitle').textContent = cls.title
        const badge = document.getElementById('detailStatusBadge')
        badge.textContent = cls.status === 'ACTIVE' ? '진행중' : '종료'
        badge.className = `status-badge ${cls.status === 'ACTIVE' ? 'active' : 'closed'}`
        const toggleBtn = document.getElementById('btnToggleStatus')
        toggleBtn.textContent = cls.status === 'ACTIVE' ? '수업 종료' : '수업 재개'
        toggleBtn.onclick = () => toggleClassStatus(cls.id, cls.status)

        // 명단
        rosterEl.innerHTML = ''
        if (roster.length === 0) {
          rosterEl.innerHTML = '<div class="empty-msg">등록된 학생이 없습니다.</div>'
        } else {
          roster.forEach(r => {
            const row = document.createElement('div')
            row.className = 'roster-row'
            row.innerHTML = `
              <span class="roster-name">${escapeHtml(r.student_name || r.student_id)}</span>
              <span class="roster-date">${formatDate(r.created_at)}</span>
              <button class="btn-icon danger" title="제거" data-sid="${escapeHtml(r.student_id)}">
                <span class="material-symbols-rounded">person_remove</span>
              </button>
            `
            row.querySelector('.btn-icon').addEventListener('click', () => removeStudent(classId, r.student_id))
            rosterEl.appendChild(row)
          })
        }

        // 차시 매트릭스: CMS에서 레슨 목록 조회
        const curriculum = await fetch(`${CMS_BASE}/curriculums/${cls.api_curriculum_id}`)
        if (!curriculum.ok) throw new Error('cms')
        const { data: currData } = await curriculum.json()
        const lessons = currData.lessons || []
        const curriculumTitle = currData.title || ''

        // 커리큘럼 정보 표시
        const thumbEl = document.getElementById('detailCurriculumThumb')
        thumbEl.innerHTML = currData.thumbnailUrl
          ? `<img src="${currData.thumbnailUrl}" alt="" style="width:120px;height:72px;object-fit:cover;border-radius:0.5rem;display:block;">`
          : `<div style="width:120px;height:72px;border-radius:0.5rem;background:#eef0fb;display:flex;align-items:center;justify-content:center;color:#a0aadd;"><span class="material-symbols-rounded" style="font-size:2rem;">menu_book</span></div>`
        document.getElementById('detailCurriculumTitle').textContent = currData.title || ''
        document.getElementById('detailCurriculumMeta').textContent = `${lessons.length}차시`
        document.getElementById('detailCurriculumInfo').style.display = 'flex'

        // 진도 맵: student_id → { lesson_id → status }
        const progressMap = {}
        lessonProgress.forEach(p => {
          if (!progressMap[p.student_id]) progressMap[p.student_id] = {}
          progressMap[p.student_id][p.api_lesson_id] = p.status
        })

        // 전체 진행도 계산
        const totalCells = roster.length * lessons.length
        const completedCells = lessonProgress.filter(p => p.status === 'COMPLETED').length
        const pct = totalCells > 0 ? Math.round(completedCells / totalCells * 100) : 0
        const summaryEl = document.getElementById('classProgressSummary')
        if (totalCells > 0) {
          document.getElementById('classProgressLabel').textContent = `${pct}%`
          document.getElementById('classProgressFill').style.width = `${pct}%`
          document.getElementById('classProgressDetail').textContent =
            `${roster.length}명 · ${lessons.length}차시 · 완료 ${completedCells} / 전체 ${totalCells}`
          summaryEl.style.display = ''
        } else {
          summaryEl.style.display = 'none'
        }

        // 교사용 차시 목록 렌더링
        const teacherLessonEl = document.getElementById('teacherLessonListEl')
        teacherLessonEl.innerHTML = ''
        if (lessons.length === 0) {
          teacherLessonEl.innerHTML = '<div class="empty-msg">차시가 없습니다.</div>'
        } else {
          lessons.forEach((lesson, idx) => {
            teacherLessonEl.appendChild(makeTeacherLessonItem(lesson, idx + 1, classId, curriculumTitle))
          })
        }

        // 헤더 행
        const headTr = document.createElement('tr')
        headTr.innerHTML = `<th>학생</th>` + lessons.map(l =>
          `<th title="${escapeHtml(l.desc || '')}">${escapeHtml(l.title)}</th>`
        ).join('')
        matHead.appendChild(headTr)

        // 데이터 행
        roster.forEach(r => {
          const tr = document.createElement('tr')
          const studentProgress = progressMap[r.student_id] || {}
          tr.innerHTML = `<td>${escapeHtml(r.student_name || r.student_id)}</td>` + lessons.map(l => {
            const st = studentProgress[l.id] || 'NOT_STARTED'
            if (st === 'COMPLETED')  return `<td><span class="material-symbols-rounded ls-icon ls-done" title="완료">check_circle</span></td>`
            if (st === 'IN_PROGRESS') return `<td><span class="material-symbols-rounded ls-icon ls-prog" title="진행중">pending</span></td>`
            return `<td><span class="material-symbols-rounded ls-icon ls-none" title="미시작">radio_button_unchecked</span></td>`
          }).join('')
          matBody.appendChild(tr)
        })

      } catch (e) {
        rosterEl.innerHTML = '<div class="empty-msg">불러오기 실패</div>'
      }
    }

    async function toggleClassStatus(classId, currentStatus) {
      const newStatus = currentStatus === 'ACTIVE' ? 'CLOSED' : 'ACTIVE'
      const res = await fetch(`/api/class/${classId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      })

    async function showMyLessons(cls) {
      currentMyClassId = cls.id
      document.getElementById('myClassListView').style.display = 'none'
      document.getElementById('myLessonListView').style.display = ''
      document.getElementById('myClassTitle').textContent = cls.title
      const badge = document.getElementById('myClassStatusBadge')
      badge.textContent = cls.status === 'ACTIVE' ? '진행중' : '종료'
      badge.className = `status-badge ${cls.status === 'ACTIVE' ? 'active' : 'closed'}`

      const lessonEl = document.getElementById('lessonListEl')
      lessonEl.innerHTML = '<div class="empty-msg">불러오는 중...</div>'

      try {
        const [cmsRes, progressRes] = await Promise.all([
          fetch(`${CMS_BASE}/curriculums/${cls.api_curriculum_id}`),
          fetch(`/api/class/${cls.id}/lessons`),
        ])
        if (!cmsRes.ok || !progressRes.ok) throw new Error()
        const { data: currData } = await cmsRes.json()
        const { lessons: myProgress } = await progressRes.json()

        const lessons = currData.lessons || []
        currentMyClassLessons = lessons

        // 커리큘럼 정보 표시
        const myThumbEl = document.getElementById('myCurriculumThumb')
        myThumbEl.innerHTML = currData.thumbnailUrl
          ? `<img src="${currData.thumbnailUrl}" alt="" style="width:120px;height:72px;object-fit:cover;border-radius:0.5rem;display:block;">`
          : `<div style="width:120px;height:72px;border-radius:0.5rem;background:#eef0fb;display:flex;align-items:center;justify-content:center;color:#a0aadd;"><span class="material-symbols-rounded" style="font-size:2rem;">menu_book</span></div>`
        document.getElementById('myCurriculumTitle').textContent = currData.title || ''
        document.getElementById('myCurriculumMeta').textContent = `${lessons.length}차시`
        document.getElementById('myCurriculumInfo').style.display = 'flex'

        // 내 진도 맵: api_lesson_id → { status, project_id }
        const progressMap = {}
        myProgress.forEach(p => { progressMap[p.api_lesson_id] = p })

        // 나의 진도율 계산
        const totalLessons = lessons.length
        const completedCount = myProgress.filter(p => p.status === 'COMPLETED').length
        const myPct = totalLessons > 0 ? Math.min(100, Math.round(completedCount / totalLessons * 100)) : 0
        document.getElementById('myProgressFill').style.width = `${myPct}%`
        document.getElementById('myProgressLabel').textContent = `${myPct}%`

        lessonEl.innerHTML = ''
        if (lessons.length === 0) {
          lessonEl.innerHTML = '<div class="empty-msg">차시가 없습니다.</div>'
          return
        }
        lessons.forEach((lesson, idx) => {
          const prog = progressMap[lesson.id]
          const status = prog ? prog.status : 'NOT_STARTED'
          lessonEl.appendChild(makeLessonItem(lesson, idx + 1, status, prog?.project_id, cls.id, cls.status, currData.title))
        })
      } catch {
        lessonEl.innerHTML = '<div class="empty-msg">불러오기 실패</div>'
      }
    }

    function makeLessonItem(lesson, order, status, projectId, classId, classStatus, curriculumTitle) {
      const item = document.createElement('div')
      item.className = 'lesson-item'

      const defaultProjectName = [curriculumTitle, lesson.title].filter(Boolean).join('_')
      const encodedDefault = encodeURIComponent(defaultProjectName)

      let chipHtml = ''
      let actionsHtml = ''

      if (status === 'COMPLETED') {
        chipHtml = `<span class="lesson-status-chip chip-done"><span class="material-symbols-rounded" style="font-size:0.9rem">check_circle</span>완료</span>`
        actionsHtml = projectId
          ? `<button class="btn-continue" onclick="openEditor(${projectId})">다시 열기</button>`
          : ''
      } else if (status === 'IN_PROGRESS') {
        chipHtml = `<span class="lesson-status-chip chip-prog"><span class="material-symbols-rounded" style="font-size:0.9rem">pending</span>진행중</span>`
        if (!projectId && classStatus === 'ACTIVE') {
          // 프로젝트가 삭제된 경우 재생성
          actionsHtml = `<button class="btn-start" onclick="openLessonStartModal('${classId}','${lesson.id}',decodeURIComponent('${encodedDefault}'))">다시 시작</button>`
        } else {
          actionsHtml = `
            ${projectId ? `<button class="btn-continue" onclick="openEditor(${projectId})">이어하기</button>` : ''}
            ${classStatus === 'ACTIVE' ? `<button class="btn-complete" onclick="completeLesson('${classId}','${lesson.id}')">완료 제출</button>` : ''}
          `
        }
      } else {
        chipHtml = `<span class="lesson-status-chip chip-none">미시작</span>`
        actionsHtml = classStatus === 'ACTIVE'
          ? `<button class="btn-start" onclick="openLessonStartModal('${classId}','${lesson.id}',decodeURIComponent('${encodedDefault}'))">시작하기</button>`
          : ''
      }

      const pdfHtml = lesson.pdfUrl
        ? `<a href="${lesson.pdfUrl}" target="_blank" rel="noopener"
             style="display:inline-flex;align-items:center;gap:0.25rem;color:var(--color-primary);font-size:0.78rem;font-weight:700;padding:0.3rem 0.6rem;border-radius:0.4rem;text-decoration:none;flex-shrink:0;transition:background 0.15s;"
             onmouseover="this.style.background='#eef0fb'" onmouseout="this.style.background=''"
           ><span class="material-symbols-rounded" style="font-size:16px;">picture_as_pdf</span>PDF</a>`
        : ''

      item.innerHTML = `
        <div class="lesson-order">${order}</div>
        <div class="lesson-info">
          <div class="lesson-title">${escapeHtml(lesson.title)}</div>
          ${lesson.desc ? `<div class="lesson-desc">${escapeHtml(lesson.desc)}</div>` : ''}
        </div>
        ${pdfHtml}
        <div class="lesson-actions">
          ${chipHtml}
          ${actionsHtml}
        </div>
      `
      return item
    }

    document.getElementById('btnBackToMyClassList').addEventListener('click', loadMyClasses)

    // ── 교사용 차시 아이템 생성
    function makeTeacherLessonItem(lesson, order, classId, curriculumTitle) {
      const item = document.createElement('div')
      item.className = 'lesson-item'

      const defaultProjectName = [curriculumTitle, lesson.title].filter(Boolean).join('_')
      const encodedDefault = encodeURIComponent(defaultProjectName)

      const pdfHtml = lesson.pdfUrl
        ? `<a href="${lesson.pdfUrl}" target="_blank" rel="noopener"
             style="display:inline-flex;align-items:center;gap:0.25rem;color:var(--color-primary);font-size:0.78rem;font-weight:700;padding:0.3rem 0.6rem;border-radius:0.4rem;text-decoration:none;flex-shrink:0;transition:background 0.15s;"
             onmouseover="this.style.background='#eef0fb'" onmouseout="this.style.background=''"
           ><span class="material-symbols-rounded" style="font-size:16px;">picture_as_pdf</span>PDF</a>`
        : ''

      item.innerHTML = `
        <div class="lesson-order">${order}</div>
        <div class="lesson-info">
          <div class="lesson-title">${escapeHtml(lesson.title)}</div>
          ${lesson.desc ? `<div class="lesson-desc">${escapeHtml(lesson.desc)}</div>` : ''}
        </div>
        ${pdfHtml}
        <div class="lesson-actions">
          <button class="btn-start" onclick="openTeacherLessonStartModal('${escapeHtml(classId)}','${escapeHtml(lesson.id)}',decodeURIComponent('${encodedDefault}'))">열기</button>
        </div>
      `
      return item
    }

    // ── 교사 차시 시작 모달
    let pendingTeacherStartClassId = null
    let pendingTeacherStartLessonId = null

    function openTeacherLessonStartModal(classId, lessonId, defaultName = '') {
      pendingTeacherStartClassId = classId
      pendingTeacherStartLessonId = lessonId
      const input = document.getElementById('inputTeacherLessonProjectName')
      input.value = defaultName
      document.getElementById('teacherLessonStartModalOverlay').classList.add('open')
      input.focus()
      input.select()
    }

    function closeTeacherLessonStartModal() {
      document.getElementById('teacherLessonStartModalOverlay').classList.remove('open')
      pendingTeacherStartClassId = null
      pendingTeacherStartLessonId = null
    }

    document.getElementById('btnTeacherLessonStartCancel').addEventListener('click', closeTeacherLessonStartModal)
    document.getElementById('teacherLessonStartModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('teacherLessonStartModalOverlay')) closeTeacherLessonStartModal()
    })

    document.getElementById('btnTeacherLessonStartSubmit').addEventListener('click', async () => {
      const project_name = document.getElementById('inputTeacherLessonProjectName').value.trim()
      if (!project_name) return
      const res = await fetch(`/api/class/${pendingTeacherStartClassId}/lessons/${pendingTeacherStartLessonId}/teacher-start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_name }),
      })
      if (res.ok) {
        const { project_id } = await res.json()
        closeTeacherLessonStartModal()
        if (project_id) {
          window.open(`/editor?projectId=${project_id}`, '_blank')
        }
      } else {
        const { error } = await res.json().catch(() => ({}))
        alert(error || '열기 실패')
      }
    })

    function openEditor(projectId) {
      window.open(`/editor?projectId=${projectId}`, '_blank')
    }

    async function completeLesson(classId, lessonId) {
      if (!confirm('이 차시를 완료로 제출할까요?')) return
      const res = await fetch(`/api/class/${classId}/lessons/${lessonId}/complete`, { method: 'POST' })
      if (res.ok) {
        // 현재 수업 차시 목록 새로고침
        const cls = { id: classId, api_curriculum_id: null, title: document.getElementById('myClassTitle').textContent, status: 'ACTIVE' }
        // api_curriculum_id 는 다시 fetch로 받아와야 하므로 loadMyClasses 후 재진입
        showMyLessonsById(classId)
      } else {
        alert('제출 실패')
      }
    }

    async function showMyLessonsById(classId) {
      const res = await fetch('/api/class/my')
      if (!res.ok) return
      const { classes } = await res.json()
      const cls = classes.find(c => c.id === classId)
      if (cls) showMyLessons(cls)
    }

    // 차시 시작 모달
    function openLessonStartModal(classId, lessonId, defaultName = '') {
      pendingStartClassId = classId
      pendingStartLessonId = lessonId
      const input = document.getElementById('inputLessonProjectName')
      input.value = defaultName
      document.getElementById('lessonStartModalOverlay').classList.add('open')
      input.focus()
      input.select()
    }

    function closeLessonStartModal() {
      document.getElementById('lessonStartModalOverlay').classList.remove('open')
      pendingStartClassId = null
      pendingStartLessonId = null
    }

    document.getElementById('btnLessonStartCancel').addEventListener('click', closeLessonStartModal)
    document.getElementById('lessonStartModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('lessonStartModalOverlay')) closeLessonStartModal()
    })

    document.getElementById('btnLessonStartSubmit').addEventListener('click', async () => {
      const project_name = document.getElementById('inputLessonProjectName').value.trim()
      if (!project_name) return
      const res = await fetch(`/api/class/${pendingStartClassId}/lessons/${pendingStartLessonId}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_name }),
      })
      if (res.ok) {
        const { lesson } = await res.json()
        closeLessonStartModal()
        if (lesson.project_id) {
          window.open(`/editor?projectId=${lesson.project_id}`, '_blank')
        }
        showMyLessonsById(currentMyClassId)
      } else {
        const { error } = await res.json().catch(() => ({}))
        alert(error || '시작 실패')
      }
    })

    // ── HTML 이스케이프 ──
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    // ── 초기화 ──
    ;(async () => {
      const user = await initHeader(i18n.get('#nav-classroom#'))
      if (!user) return

      currentUser = user
      isTeacher = user.role === 'teacher' || user.role === 'school_admin'

      // 그룹 배지 표시 (/학교명/3학년/2반 → "3학년 2반")
      if (user.group) {
        const parts = user.group.split('/').filter(Boolean)
        const label = parts.slice(1).join(' ') || parts[0]
        document.getElementById('groupBadgeLabel').textContent = label
        document.getElementById('groupBadge').style.display = ''
      }

      if (isTeacher) {
        document.getElementById('btnNewAnnouncement').style.display = ''
        document.getElementById('btnNewMaterial').style.display = ''
        document.getElementById('tabStudentProjects').style.display = ''
        document.getElementById('tabClassManage').style.display = ''
        switchTab('class-manage')
      } else {
        document.getElementById('tabMyClass').style.display = ''
        switchTab('my-class')
      }
    })()
  </script>
</body>
</html>
